<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bombergay</title>
<style>
  :root{ --bg:#12131a; --panel:#1c1e29; --line:#2b2e3d; --txt:#e8eaf2; --dim:#9aa0b5; --acc:#ffb02e; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%,#232635 0%,var(--bg) 60%);
    color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100%; padding:24px 16px; gap:40px;
  }
  h1{
    margin:0; font-size:clamp(40px,9vw,72px); font-weight:900; line-height:1;
    letter-spacing:.08em; text-transform:uppercase; font-family:"Arial Black",system-ui,sans-serif;
    background:linear-gradient(180deg,#fff7d6 0%,#ffd24a 34%,#ff9a1f 56%,#ff5c1a 78%,#c2261c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1px rgba(30,12,4,.55);
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(255,140,20,.45));
  }
  .modos{display:flex; gap:22px; flex-wrap:wrap; justify-content:center; max-width:900px}
  .carta{
    width:380px; max-width:90vw; text-align:center;
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:34px 26px; position:relative; overflow:hidden;
  }
  .carta::before{
    content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background:radial-gradient(120% 60% at 50% 0%, var(--glow) 0%, transparent 65%);
  }
  .carta.historia{ --glow:rgba(126,231,135,.2) }
  .carta.versus{ --glow:rgba(255,107,157,.22) }
  .carta h2{
    margin:0 0 10px; font-size:clamp(28px,4vw,34px); font-weight:900;
    letter-spacing:.03em; text-transform:uppercase;
  }
  .carta .tag{ margin:0 0 28px; font-size:17px; color:var(--dim) }
  .acciones{ display:flex; flex-direction:column; gap:12px }
  .acciones a{
    display:block; text-decoration:none; color:inherit;
    padding:18px; border-radius:14px; font-weight:800; font-size:20px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    transition:transform .12s ease, background .12s ease;
  }
  .acciones a:hover{ background:rgba(255,255,255,.14); transform:translateY(-2px) }
  .versus .acciones a{ background:var(--acc); color:#1a1000; border-color:transparent }
  .versus .acciones a:hover{ filter:brightness(1.08) }
</style>
</head>
<body>
  <h1>Bombergay</h1>

  <div class="modos">
    <div class="carta historia">
      <h2>Historia</h2>
      <p class="tag">11 niveles · 1 o 2 jugadores</p>
      <div class="acciones">
        <a href="index.html?p=1">1 jugador</a>
        <a href="index.html?p=2">2 en un teclado</a>
        <a href="historia.html">2 en red</a>
      </div>
    </div>

    <div class="carta versus">
      <h2>Versus</h2>
      <p class="tag">Hasta 4 jugadores en red</p>
      <div class="acciones">
        <a href="versus.html">Entrar</a>
      </div>
    </div>
  </div>
</body>
</html>
