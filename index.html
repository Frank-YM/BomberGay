<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bombergay — juego web</title>
<style>
  :root{
    --bg:#12131a; --panel:#1c1e29; --line:#2b2e3d;
    --txt:#e8eaf2; --dim:#9aa0b5; --acc:#ffb02e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%,#232635 0%,var(--bg) 60%);
    color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100%; padding:12px; gap:10px; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  h1{
    margin:0; font-size:clamp(30px,6.5vw,56px); font-weight:900; line-height:1;
    letter-spacing:.12em; text-transform:uppercase; font-family:"Arial Black","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(180deg,#fff7d6 0%,#ffd24a 34%,#ff9a1f 56%,#ff5c1a 78%,#c2261c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1px rgba(30,12,4,.55);
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 6px 16px rgba(0,0,0,.6))
           drop-shadow(0 0 26px rgba(255,140,20,.45));
    position:relative; padding:2px 6px 6px;
    animation:breathe 3.4s ease-in-out infinite;
  }
  /* destello que barre las letras */
  h1::after{
    content:attr(data-text); position:absolute; inset:2px 6px 6px;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.92) 50%,transparent 62%);
    background-size:260% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shine{ 0%,55%{background-position:180% 0} 100%{background-position:-80% 0} }
  @keyframes breathe{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.025)} }
  @media (prefers-reduced-motion:reduce){ h1,h1::after{animation:none} }
  #hud{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:13px;
  }
  /* tablero grande (jefe final): compacta cabecera para dejarle más alto a la arena */
  body.compacto{ padding:6px; gap:5px; }
  body.compacto h1{ font-size:clamp(18px,3.6vw,28px); padding:1px 4px 3px; }
  body.compacto #hud{ padding:4px 8px; font-size:11px; gap:5px; }
  body.compacto .seg{ width:12px; height:8px }
  #hud span{color:var(--dim)}
  #hud b{color:var(--txt); font-variant-numeric:tabular-nums}
  .hp{display:flex; align-items:center; gap:6px}
  .bar{display:flex; gap:3px}
  .seg{
    width:18px; height:11px; border-radius:3px;
    background:#232636; border:1px solid #3a3f55; transition:background .2s, box-shadow .2s;
  }
  .seg.on{border-color:transparent; box-shadow:0 0 8px currentColor inset, 0 0 6px currentColor}
  .seg.on.g{background:linear-gradient(180deg,#8dffb0,#31c46a); color:#31c46a}
  .seg.on.y{background:linear-gradient(180deg,#ffe27a,#ffb02e); color:#ffb02e}
  .seg.on.r{background:linear-gradient(180deg,#ff9a8a,#e0392b); color:#e0392b}
  .seg.on.r{animation:hpblink 1s ease-in-out infinite}
  @keyframes hpblink{ 0%,100%{opacity:1} 50%{opacity:.55} }
  #dev{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
    background:#161826; border:1px dashed #3a3f55; border-radius:10px; padding:6px 10px; font-size:12px;
    color:var(--dim);
  }
  #dev .tag{
    background:#c0392b; color:#fff; font-weight:700; letter-spacing:1px;
    border-radius:4px; padding:1px 6px; font-size:10px;
  }
  #dev label{display:flex; align-items:center; gap:6px}
  #dev input[type=number]{
    font:inherit; width:52px; background:#232636; color:var(--txt);
    border:1px solid #3a3f55; border-radius:6px; padding:3px 6px;
  }
  #dev select{
    font:inherit; background:#232636; color:var(--txt);
    border:1px solid #3a3f55; border-radius:6px; padding:3px 6px;
  }
  #dev button{
    font:inherit; background:#232636; color:var(--txt);
    border:1px solid #3a3f55; border-radius:6px; padding:3px 9px; font-weight:500;
  }
  #dev button:hover{border-color:var(--acc); color:var(--acc)}
  #stage{position:relative; line-height:0;
    width:min(94vw, 1100px, calc(78vh * 1.5385)); max-width:100%}
  canvas{
    display:block; background:#0e0f16;
    border:3px solid #2f3348; border-radius:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05) inset,
               0 0 60px rgba(255,176,46,.07);
    width:min(94vw, 1100px, calc(78vh * 1.5385)); max-width:100%; height:auto;
  }
  #overlay{
    position:absolute; inset:0; backdrop-filter:blur(3px); display:flex; flex-direction:column; gap:12px;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(10,11,16,.86); border-radius:8px; padding:20px;
    overflow:auto; max-height:100%;          /* que quepa en pantallas pequeñas */
  }
  #overlay.hidden{display:none}
  #overlay h2{margin:0; font-size:26px; color:var(--acc)}
  #overlay p{margin:0; color:var(--dim); font-size:13px; line-height:1.6; max-width:420px}
  .btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  button{
    font:inherit; font-weight:600; cursor:pointer; color:#12131a; background:var(--acc);
    border:0; border-radius:8px; padding:10px 18px;
  }
  button.ghost{background:transparent; color:var(--txt); border:1px solid var(--line)}
  #pad{display:none; gap:24px; align-items:center; justify-content:center; width:100%; max-width:520px}
  .dpad{display:grid; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(3,52px); gap:4px}
  .dpad button, #fire{
    background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:10px;
    padding:0; font-size:18px; touch-action:none;
  }
  #fire{width:74px; height:74px; border-radius:50%; background:#c0392b; color:#fff; font-size:13px}
  #tp{width:56px; height:56px; border-radius:50%; background:#1f6f57; color:#dfffef; font-size:13px;
      border:1px solid #2b8a6c}
  #det{width:56px; height:56px; border-radius:50%; background:#7a2020; color:#ffe0e0; font-size:15px;
       font-weight:700; border:1px solid #a83030}
  .k{background:#232636; border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--txt)}
  @media (pointer:coarse){ #pad{display:flex} }
</style>
</head>
<body>
<h1 data-text="Bombergay">Bombergay</h1>

<div id="hud">
  <div><span>Nivel</span> <b id="h-level">1</b></div>
  <div><span>Puntos</span> <b id="h-score">0</b></div>
  <div class="hp"><span>Vida</span> <div class="bar" id="h-hp"></div> <b id="h-lives">3</b></div>
  <div><span>Bombas</span> <b id="h-bombs">1</b></div>
  <div><span>Fuego</span> <b id="h-fire">1</b></div>
  <div><span>Enemigos</span> <b id="h-enem">0</b></div>
  <div><span>Montura</span> <b id="h-mount">—</b></div>
  <div><span>Teleport</span> <b id="h-tp">Listo</b></div>
  <div><span>Detonador</span> <b id="h-det">—</b></div>
  <div><span>Espinas</span> <b id="h-spike">—</b></div>
</div>

<div id="dev">
  <span class="tag">DEV</span>
  <label>Escenario
    <select id="dev-theme"></select>
  </label>
  <button id="dev-prev" title="Anterior ( [ )">◀</button>
  <button id="dev-next" title="Siguiente ( ] )">▶</button>
  <button id="dev-regen" title="Regenerar mapa">↻ Mapa</button>
  <label>Nivel
    <input id="dev-level" type="number" min="1" max="99" value="1">
  </label>
  <button id="dev-lvl-prev" title="Nivel anterior ( - )">◀</button>
  <button id="dev-lvl-next" title="Nivel siguiente ( + )">▶</button>
  <label>Enemigos
    <select id="dev-kind"></select>
  </label>
  <button id="dev-spawn" title="Soltar uno ahora ( R )">＋ Soltar</button>
</div>

<div id="stage">
  <canvas id="game"></canvas>
  <div id="overlay">
    <h2 id="ov-title">Bombergay</h2>
    <p id="ov-text"></p>
    <div class="btns" id="ov-btns"></div>
  </div>
</div>

<div id="pad">
  <div class="dpad">
    <span></span><button data-d="up">▲</button><span></span>
    <button data-d="left">◀</button><span></span><button data-d="right">▶</button>
    <span></span><button data-d="down">▼</button><span></span>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <button id="fire">BOMBA</button>
    <button id="tp">TP</button>
    <button id="det">E</button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ---------- constantes ---------- */
let COLS = 20, ROWS = 13;
const TS = 40;
const EMPTY = 0, SOLID = 1, BRICK = 2;
const BOMB_TIME = 2.4, FLAME_TIME = 0.5, HALF = 15;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = COLS * TS, H = ROWS * TS;   // medidas lógicas del tablero
const RES = Math.min(2, window.devicePixelRatio || 1);   // nítido sin gastar de más

// el suelo y los muros no cambian frame a frame: se pintan una vez en una
// capa aparte y se reutilizan con drawImage, en vez de recalcular ~200
// degradados por fotograma.
const boardLayer = document.createElement('canvas');
const boardCtx = boardLayer.getContext('2d', { alpha: false });
let boardSucio = true;                // se repinta cuando cambia el mapa

// el nivel 11 usa un tablero más grande (jefe final): recalcula el lienzo
// y el ancho en pantalla para que siga entrando sin desbordar.
const stageEl = document.getElementById('stage');
function ajustarTamanoTablero(){
  W = COLS * TS; H = ROWS * TS;
  canvas.width = W * RES; canvas.height = H * RES;
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  boardLayer.width = canvas.width; boardLayer.height = canvas.height;
  boardCtx.setTransform(RES, 0, 0, RES, 0, 0);

  // escala real: los bloques mantienen su tamaño (TS) mientras entren en
  // pantalla; solo se encogen lo justo para no desbordar el viewport.
  const h1El = document.querySelector('h1'), hudEl = document.getElementById('hud'), devEl = document.getElementById('dev');
  const cabecera = (h1El ? h1El.offsetHeight : 0) + (hudEl ? hudEl.offsetHeight : 0) +
                   (devEl ? devEl.offsetHeight : 0) + 70;   // + gaps/padding del body
  const anchoDisp = Math.min(window.innerWidth * 0.96, 1100);
  const altoDisp = Math.max(220, window.innerHeight - cabecera);
  const escala = Math.min(anchoDisp / W, altoDisp / H);
  const anchoFinal = Math.round(W * escala) + 'px';
  if (stageEl) stageEl.style.width = anchoFinal;
  canvas.style.width = anchoFinal;
  boardSucio = true;
}
window.addEventListener('resize', () => ajustarTamanoTablero());
ajustarTamanoTablero();

function pintarTableroEstatico(){
  drawFloor(boardCtx);
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++){
      if (grid[y][x] === SOLID) drawSolid(x, y, boardCtx);
      else if (grid[y][x] === BRICK) drawBrick(x, y, boardCtx);
    }
  boardSucio = false;
}

const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ov-title');
const ovText  = document.getElementById('ov-text');
const ovBtns  = document.getElementById('ov-btns');

/* ---------- estado ---------- */
let grid, items, bombs, flames, enemies, players, particles, mounts, rings, beams;
let sacudida = 0, focosPrevios = 0, fogonazo = 0, luces = [];
let level = 1, score = 0, mode = 'menu', twoPlayers = false, levelTimer = 0;
const keys = Object.create(null);
let hover = null;          // casilla bajo el ratón

/* ---------- utilidades ---------- */
const rnd = n => Math.floor(Math.random() * n);
const cellOf = v => Math.floor(v / TS);
const center = c => c * TS + TS / 2;

function tileAt(cx, cy){
  if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return SOLID;
  return grid[cy][cx];
}
function bombAt(cx, cy){
  return bombs.find(b => b.cx === cx && b.cy === cy) || null;
}
function flameAt(cx, cy){
  return flames.some(f => f.cx === cx && f.cy === cy);
}
function blocked(cx, cy, ent){
  const fantasma = ent && ENEMY_KINDS[ent.kind] && ENEMY_KINDS[ent.kind].phase;
  if (fantasma){
    if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return true;   // no se sale del mapa
  } else if (tileAt(cx, cy) !== EMPTY) return true;
  const b = bombAt(cx, cy);
  if (b && !(ent && b.pass.has(ent))) return true;
  return false;
}

/* ---------- audio ---------- */
let actx = null;
// compresor de volumen: en vez de multiplicar (que mantiene la misma
// diferencia relativa entre sonidos), acerca todos los efectos a un
// mismo nivel — los flojos suben más que los que ya sonaban fuerte.
const nivelarVol = vol => 0.039 + 0.29 * Math.sqrt(vol);
function beep(freq, dur, type = 'square', vol = 0.05){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(nivelarVol(vol), actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(e){}
}

/* ---------- monturas (yoshis) ---------- */
const MOUNTS = {
  speed: { color: '#5ddc7a', boost: 1.5,  label: 'Verde · velocidad' },
  bomb:  { color: '#ffa640', boost: 1.2,  label: 'Naranja · +1 bomba' },
  kick:  { color: '#5ec4ff', boost: 1.25, label: 'Azul · patada' }
};
const MOUNT_KEYS = Object.keys(MOUNTS);

function makeMount(type){
  const m = MOUNTS[type];
  return { type, color: m.color, boost: m.boost, face: 1, anim: 0 };
}
function releaseMount(p){
  const m = p.mount;
  p.mount = null;
  mounts.push({
    ...m, x: p.x, y: p.y, speed: 95, flee: 1.6, think: 0,
    dir: [[1,0],[-1,0],[0,1],[0,-1]][rnd(4)]
  });
}

/* ---------- tipos de enemigo ---------- */
const ENEMY_KINDS = {
  walker: { name:'Bicho',    color:'#b07cff', smart:false, tpRange:3,
            speed:l => 38 + l * 1.5, tp:() => 3.5 + Math.random()*2.5, atk:() => 5 + Math.random()*4 },
  hunter: { name:'Cazador',  color:'#ff6b6b', smart:true,  tpRange:3,
            speed:l => 52 + l * 2,  tp:() => 2.2 + Math.random()*2,   atk:() => 3.5 + Math.random()*4 },
  ghost:  { name:'Espectro', color:'#8fe9ff', smart:false, tpRange:4,
            speed:l => 30 + l * 1.5, tp:() => .8 + Math.random()*.9,   atk:() => 9 + Math.random()*5 },
  eye:    { name:'Vigía',    color:'#ffcf4d', smart:true,  tpRange:3,
            speed:l => 42 + l * 1.5, tp:() => 1.6 + Math.random()*1.4, atk:() => 2.5 + Math.random()*2.5 },
  spider: { name:'Araña',    color:'#ff7043', smart:true,  tpRange:3,
            speed:l => 58 + l * 2,  tp:() => 1.8 + Math.random()*1.6, atk:() => 4 + Math.random()*3 },
  crystal:{ name:'Cristal',  color:'#e26bff', smart:false, tpRange:5,
            speed:l => 26 + l,      tp:() => .5 + Math.random()*.7,   atk:() => 3 + Math.random()*3 },
  slime:  { name:'Gelatina', color:'#79e06b', smart:false, tpRange:3,
            speed:l => 28 + l * 1.5, tp:() => 4 + Math.random()*3,     atk:() => 12 + Math.random()*6 },
  banana: { name:'Plátano',  color:'#ff9ecb', smart:true,  tpRange:4, chargeTime:.95, beam:'milk',
            beamRange:4,                                    // el chorro llega más lejos
            speed:l => 145 + l * 3,                          // sigue siendo el más rápido con diferencia
            tp:() => 2 + Math.random()*1.5, atk:() => 1.5 + Math.random()*1.5 },
  skull:  { name:'Calavera', color:'#eef0ff', smart:true,  tpRange:4,
            speed:l => 36 + l * 1.5, tp:() => 1.2 + Math.random()*1.2, atk:() => 2 + Math.random()*2 },
  redghost: { name:'Fantasma rojo', color:'#ff3b3b', glow:'255,70,70', smart:true, noTp:true, phase:true,
            speed:l => 34 + l * 1.2, tp:() => 9999, atk:() => 9999 },
  titan: { name:'Titán', color:'#7a2ee6', glow:'170,90,255', smart:true, noTp:true, phase:true, size:2, radius:42,
            speed:l => 30 + l, tp:() => 9999, atk:() => 9999 }
};

// poderes que se van desbloqueando
const puedenSaltar  = () => level >= 2;      // teletransporte enemigo
const puedenDisparar = () => level >= 4;     // rayo / chorro
const sonEnemigosSonsos = () => level === 1; // nivel 1: torpes, no persiguen ni esquivan
const torpeza = () => level === 1 ? 2 : level <= 5 ? 1 : 0;    // 2 = tontos, 1 = despistados
// lastres de los primeros niveles
const factorVel   = () => level === 1 ? .55 : level === 2 ? .7 : level === 3 ? .68
                        : level === 4 ? .75 : level <= 6 ? .85 : 1;
const factorSalto = () => level <= 2 ? 2 : level <= 4 ? 2.6 : level <= 6 ? 1.6 : 1;

function pickKind(lvl){
  if (kindOverride) return kindOverride;
  if (lvl === 11) return 'titan';                     // nivel 11: solo el titán
  if (lvl === 1) return 'walker';                     // nivel 1: solo bichos
  if (lvl === 2) return Math.random() < .55 ? 'slime' : 'walker';   // nivel 2: gelatinas y bichos
  if (lvl === 3) return 'ghost';                                    // nivel 3: solo espectros
  if (lvl === 4) return 'slime';                                    // nivel 4: gelatinas + 1 espectro
  const pool = ['walker', 'walker', 'spider'];
  if (lvl >= 5) pool.push('ghost', 'crystal', 'slime', 'hunter', 'spider');
  if (lvl >= 4) pool.push('eye', 'crystal', 'skull');
  if (lvl >= 6) pool.push('eye', 'hunter', 'skull');
  return pool[rnd(pool.length)];
}

function makeEnemy(kind, cx, cy){
  const k = ENEMY_KINDS[kind];
  return {
    kind, x: center(cx), y: center(cy),
    dir: [[1,0],[-1,0],[0,1],[0,-1]][rnd(4)],
    speed: k.speed(level) * factorVel(),
    smart: k.smart, color: k.color, tpRange: k.tpRange, glow: k.glow,
    alive: true, think: 0,
    tpCd: k.tp() * factorSalto(), tpWarn: 0,
    atkCd: k.atk(), charge: 0, chargeDir: [1, 0],
    anim: Math.random() * 6
  };
}

// golpe grave y ruidoso para las explosiones
function boom(fuerza = 1){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    const dur = .22 + .3 * fuerza;                 // las grandes retumban más
    const largo = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, largo, actx.sampleRate);
    const dat = buf.getChannelData(0);
    for (let i = 0; i < largo; i++) dat[i] = (Math.random() * 2 - 1) * (1 - i / largo);
    const src = actx.createBufferSource(); src.buffer = buf;
    const filtro = actx.createBiquadFilter();
    filtro.type = 'lowpass';
    filtro.frequency.setValueAtTime(2400 - 900 * fuerza, t0);
    filtro.frequency.exponentialRampToValueAtTime(220 - 110 * fuerza, t0 + dur);
    const gan = actx.createGain();
    gan.gain.setValueAtTime(.2 + .4 * fuerza, t0);
    gan.gain.exponentialRampToValueAtTime(.0001, t0 + dur + .05);
    src.connect(filtro).connect(gan).connect(actx.destination);
    src.start();
    const osc = actx.createOscillator(), g2 = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(210 - 90 * fuerza, t0);
    osc.frequency.exponentialRampToValueAtTime(70 - 34 * fuerza, t0 + dur * .8);
    g2.gain.setValueAtTime(.16 + .48 * fuerza, t0);
    g2.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    osc.connect(g2).connect(actx.destination);
    osc.start(); osc.stop(t0 + dur + .02);
  } catch(e){}
}

// zumbido de teletransporte: sube al desaparecer, baja al aparecer
function sonidoWarp(sube = true, vol = .05){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime, dur = .28;
    const osc = actx.createOscillator(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(sube ? 220 : 1400, t0);
    osc.frequency.exponentialRampToValueAtTime(sube ? 1500 : 260, t0 + dur);
    lfo.frequency.value = 28; lg.gain.value = 40;
    lfo.connect(lg).connect(osc.frequency);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur + .05);
    osc.connect(g).connect(actx.destination);
    osc.start(); lfo.start();
    osc.stop(t0 + dur + .06); lfo.stop(t0 + dur + .06);
  } catch(e){}
}

/* ---------- generación de nivel ---------- */
function makePlayer(idx){
  const spawns = [{cx:1,cy:1},{cx:COLS-2,cy:ROWS-2}];
  const s = spawns[idx];
  return {
    idx, x: center(s.cx), y: center(s.cy), spawn: s,
    speed: 105, maxBombs: 1, range: 1, lives: 3, maxLives: 3,
    alive: true, invuln: 1.5, dying: 0, mount: null,
    aim: null, aimT: 0, aimPrev: '', tpCd: 0, face: [0, 0], remote: false, spike: false, warp: null,
    color: idx === 0 ? '#4ec3ff' : '#7ee787'
  };
}

function buildLevel(){
  // el nivel 11 (jefe final) usa un tablero más grande: 5 casillas más
  // a lo ancho y 4 más de alto, sin que se salga de la pantalla.
  COLS = level === 11 ? 25 : 20;
  ROWS = level === 11 ? 17 : 13;
  document.body.classList.toggle('compacto', level === 11);
  ajustarTamanoTablero();
  boardSucio = true;
  grid  = Array.from({length: ROWS}, () => new Array(COLS).fill(EMPTY));
  items = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
  bombs = []; flames = []; enemies = []; particles = []; mounts = []; rings = []; beams = [];

  // bordes y pilares
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (x === 0 || y === 0 || x === COLS-1 || y === ROWS-1 || (x % 2 === 0 && y % 2 === 0))
        grid[y][x] = SOLID;

  // zonas libres de spawn
  const safe = new Set();
  const clearAround = (cx, cy) => {
    [[0,0],[1,0],[0,1],[2,0],[0,2],[1,1]].forEach(([dx,dy]) => {
      const nx = cx + (cx === 1 ? dx : -dx), ny = cy + (cy === 1 ? dy : -dy);
      safe.add(ny * COLS + nx);
    });
  };
  clearAround(1, 1);
  clearAround(COLS-2, ROWS-2);

  // bloques destructibles
  const bricks = [];
  const density = Math.min(0.78, 0.55 + level * 0.02);
  for (let y = 1; y < ROWS-1; y++)
    for (let x = 1; x < COLS-1; x++)
      if (grid[y][x] === EMPTY && !safe.has(y*COLS+x) && Math.random() < density){
        grid[y][x] = BRICK;
        bricks.push({x, y});
      }

  // salida + power-ups ocultos
  if (bricks.length){
    const shuffled = bricks.slice().sort(() => Math.random() - 0.5);
    let i = 0;
    items[shuffled[i].y][shuffled[i].x] = 'exit'; i++;
    // huevo de montura: uno nada más por nivel
    if (i < shuffled.length){
      items[shuffled[i].y][shuffled[i].x] = 'egg'; i++;
    }

    // corazones: dos seguros en el nivel 2, luego uno de vez en cuando
    const corazones = level === 2 ? 2 : (Math.random() < .35 ? 1 : 0);
    for (let c = 0; c < corazones && i < shuffled.length; c++, i++)
      items[shuffled[i].y][shuffled[i].x] = 'life';

    // bomba de espinas: solo en los niveles 4 y 5
    if (i < shuffled.length && (level === 4 || level === 5)){
      items[shuffled[i].y][shuffled[i].x] = 'spike'; i++;
    }

    // detonador (tiempo): solo en los niveles 2 y 3
    if (i < shuffled.length && (level === 2 || level === 3)){
      items[shuffled[i].y][shuffled[i].x] = 'remote'; i++;
    }

    const pool = ['bomb','fire','fire','speed','bomb','fire'];
    const count = Math.min(3 + rnd(3), shuffled.length - 1);
    for (let k = 0; k < count && i < shuffled.length; k++, i++)
      items[shuffled[i].y][shuffled[i].x] = pool[rnd(pool.length)];
  }

  // enemigos lejos de los spawns
  const total = level === 1 ? 3 : level === 3 ? 5 : level === 4 ? 6 : level === 11 ? 1 : Math.min(14, 3 + level);
  const clearancia = level === 11 ? 8 : 6;
  let guard = 0;
  while (enemies.length < total && guard++ < 900){
    const x = 1 + rnd(COLS-2), y = 1 + rnd(ROWS-2);
    if (grid[y][x] !== EMPTY) continue;
    if (Math.abs(x-1) + Math.abs(y-1) < clearancia) continue;
    if (Math.abs(x-(COLS-2)) + Math.abs(y-(ROWS-2)) < clearancia && (twoPlayers || level === 11)) continue;
    if (enemies.some(e => cellOf(e.x) === x && cellOf(e.y) === y)) continue;
    enemies.push(makeEnemy(pickKind(level), x, y));
  }
  ensureVariety();
}

function ensureVariety(){
  if (kindOverride) return;                 // en DEV manda el tipo elegido
  // garantiza tipos distintos según el nivel
  const garantizados = [];
  if (level === 11) return;                    // nivel 11: solo el titán, ya asignado
  if (level === 1) return;                     // nivel 1: solo bichos, sin sorpresas
  if (level === 2){                            // nivel 2: solo gelatina y bicho
    if (!enemies.some(e => e.kind === 'slime') && enemies.length)
      Object.assign(enemies[0], makeEnemy('slime', cellOf(enemies[0].x), cellOf(enemies[0].y)));
    return;
  }
  if (level === 3) return;                     // nivel 3: solo espectros
  if (level === 4){                            // nivel 4: gelatinas y un único espectro
    if (enemies.length && !enemies.some(e => e.kind === 'ghost'))
      Object.assign(enemies[0], makeEnemy('ghost', cellOf(enemies[0].x), cellOf(enemies[0].y)));
    return;
  }
  if (level >= 5) garantizados.push('spider', 'crystal');
  if (level >= 5) garantizados.push('skull');
  if (level >= 6) garantizados.push('eye');
  garantizados.forEach((kind, i) => {
    if (enemies.length <= i) return;
    if (enemies.some(e => e.kind === kind)) return;
    const e = enemies[i];
    Object.assign(e, makeEnemy(kind, cellOf(e.x), cellOf(e.y)));
  });

  let cursor = garantizados.length;

  // plátanos: 1 desde el nivel 6, sumando uno más por nivel hasta 5 en el último
  const bananasReq = level >= 6 ? Math.min(level - 5, 5) : 0;
  let bananasActuales = enemies.filter(e => e.kind === 'banana').length;
  while (bananasActuales < bananasReq && cursor < enemies.length){
    if (enemies[cursor].kind !== 'banana'){
      Object.assign(enemies[cursor], makeEnemy('banana', cellOf(enemies[cursor].x), cellOf(enemies[cursor].y)));
      bananasActuales++;
    }
    cursor++;
  }

  // fantasmas rojos: solo en los niveles 8, 9 y 10 (dos en el último)
  const redReq = level === 8 || level === 9 ? 1 : level >= 10 ? 2 : 0;
  let redActuales = enemies.filter(e => e.kind === 'redghost').length;
  while (redActuales < redReq && cursor < enemies.length){
    if (enemies[cursor].kind !== 'redghost'){
      Object.assign(enemies[cursor], makeEnemy('redghost', cellOf(enemies[cursor].x), cellOf(enemies[cursor].y)));
      redActuales++;
    }
    cursor++;
  }
}

function spawnEnemy(kind){
  for (let intento = 0; intento < 400; intento++){
    const x = 1 + rnd(COLS - 2), y = 1 + rnd(ROWS - 2);
    if (grid[y][x] !== EMPTY) continue;
    if (bombAt(x, y) || flameAt(x, y)) continue;
    if (players.some(p => Math.abs(cellOf(p.x) - x) + Math.abs(cellOf(p.y) - y) < 4)) continue;
    const e = makeEnemy(kind, x, y);
    enemies.push(e);
    rings.push({ x: e.x, y: e.y, t: .5, max: 34, c: e.color });
    beep(400, .1, 'sine', .04);
    return true;
  }
  return false;
}

function resetPositions(){
  bombs = []; flames = []; particles = []; rings = []; beams = [];
  players.forEach(p => {
    if (p.lives <= 0) return;
    p.x = center(p.spawn.cx); p.y = center(p.spawn.cy);
    p.alive = true; p.dying = 0; p.invuln = 2;
  });
}

/* ---------- movimiento ---------- */
function step(ent, dx, dy, dt){
  if (!dx && !dy) return false;
  const s = ent.speed * (ent.mount ? ent.mount.boost : 1) * dt;
  const cx = cellOf(ent.x), cy = cellOf(ent.y);
  let moved = false;

  if (dx){
    const lane = center(cy), d = lane - ent.y;
    if (Math.abs(d) > 0.5) ent.y += Math.sign(d) * Math.min(s * 0.8, Math.abs(d));
    else ent.y = lane;
    const nx = ent.x + dx * s;
    const edge = nx + dx * (HALF - 2);
    if (!blocked(cellOf(edge), cellOf(ent.y), ent)){ ent.x = nx; moved = true; }
    else {
      const wall = center(cx);
      const clamped = dx > 0 ? Math.min(nx, wall) : Math.max(nx, wall);
      if (clamped !== ent.x){ ent.x = clamped; moved = true; }
    }
  }
  if (dy){
    const lane = center(cx), d = lane - ent.x;
    if (Math.abs(d) > 0.5) ent.x += Math.sign(d) * Math.min(s * 0.8, Math.abs(d));
    else ent.x = lane;
    const ny = ent.y + dy * s;
    const edge = ny + dy * (HALF - 2);
    if (!blocked(cellOf(ent.x), cellOf(edge), ent)){ ent.y = ny; moved = true; }
    else {
      const wall = center(cy);
      const clamped = dy > 0 ? Math.min(ny, wall) : Math.max(ny, wall);
      if (clamped !== ent.y){ ent.y = clamped; moved = true; }
    }
  }
  return moved;
}

/* ---------- bombas y explosiones ---------- */
function placeBomb(p){
  const cx = cellOf(p.x), cy = cellOf(p.y);
  if (bombAt(cx, cy)) return;
  const limit = p.maxBombs + (p.mount && p.mount.type === 'bomb' ? 1 : 0);
  if (bombs.filter(b => b.owner === p).length >= limit) return;
  bombs.push({ cx, cy, x: center(cx), y: center(cy), slide: null,
               t: p.remote ? Infinity : BOMB_TIME, remote: p.remote, pierce: p.spike,
               range: p.range, owner: p, pass: new Set([p]) });
  beep(150, 0.08, 'sine', 0.04);
}

// R: revienta la bomba más antigua que hayas puesto
function detonateRemote(p){
  const mia = bombs.filter(b => b.owner === p && b.remote);
  if (!mia.length){ beep(120, .1, 'square', .04); return; }
  detonate(mia[0]);
}

function detonate(bomb){
  const i = bombs.indexOf(bomb);
  if (i === -1) return;
  bombs.splice(i, 1);
  // el golpe crece con el alcance: una bomba corta apenas cosquillea
  const fuerza = Math.min(1, (bomb.range + (bomb.pierce ? 1.5 : 0)) / 5);
  boom(fuerza);
  if (bomb.pierce) beep(340, .18, 'square', .05);
  sacudida = Math.max(sacudida, 4 + fuerza * 20);
  fogonazo = Math.max(fogonazo, .14 + fuerza * .46);
  luces.push({ x: center(bomb.cx), y: center(bomb.cy), t: .35, f: fuerza });

  const cells = [{cx: bomb.cx, cy: bomb.cy, core: true, spike: bomb.pierce}];
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    for (let r = 1; r <= bomb.range; r++){
      const cx = bomb.cx + dx * r, cy = bomb.cy + dy * r;
      const t = tileAt(cx, cy);
      if (t === SOLID) break;
      if (t === BRICK){
        grid[cy][cx] = EMPTY;
        boardSucio = true;
        score += 10;
        const emp = 120 + bomb.range * 70;
        for (let k = 0; k < 8 + bomb.range * 2; k++)
          particles.push({ x: center(cx), y: center(cy),
                           vx: (Math.random()-.5) * emp, vy: (Math.random()-.5) * emp - 60,
                           t: .5 + Math.random() * .35, c: k % 3 ? TH().brick[0] : TH().brick[1] });
        cells.push({cx, cy, dx, dy, spike: bomb.pierce, end: !bomb.pierce || r === bomb.range});
        if (!bomb.pierce) break;              // la de espinas sigue de largo
        continue;
      }
      cells.push({cx, cy, dx, dy, spike: bomb.pierce, end: r === bomb.range});
    }
  }

  for (const c of cells){
    flames.push({ ...c, t: FLAME_TIME });
    const chain = bombAt(c.cx, c.cy);
    if (chain) detonate(chain);
  }
}

function kickBomb(p, dx, dy){
  if (!p.mount || p.mount.type !== 'kick' || (!dx && !dy)) return;
  const cx = cellOf(p.x), cy = cellOf(p.y);
  const b = bombAt(cx + dx, cy + dy);
  if (!b || b.slide) return;
  // alineado con el carril de la bomba
  if (dx && Math.abs(p.y - center(cy)) > 6) return;
  if (dy && Math.abs(p.x - center(cx)) > 6) return;
  b.slide = [dx, dy];
  b.pass.clear();
  beep(300, 0.08, 'square', 0.04);
}

function slideBombs(dt){
  for (const b of bombs){
    if (!b.slide) continue;
    const [dx, dy] = b.slide;
    const speed = 190;
    b.x += dx * speed * dt;
    b.y += dy * speed * dt;
    const ncx = cellOf(b.x), ncy = cellOf(b.y);
    if (ncx !== b.cx || ncy !== b.cy){
      const stop = tileAt(ncx, ncy) !== EMPTY || bombs.some(o => o !== b && o.cx === ncx && o.cy === ncy);
      if (stop){
        b.x = center(b.cx); b.y = center(b.cy); b.slide = null;
      } else {
        b.cx = ncx; b.cy = ncy;
      }
    }
    // se detiene al chocar con alguien
    if (b.slide){
      const hit = [...players, ...enemies].some(e =>
        (e.alive !== false) && Math.abs(e.x - b.x) < 18 && Math.abs(e.y - b.y) < 18 && e !== b.owner);
      if (hit){ b.x = center(b.cx); b.y = center(b.cy); b.slide = null; }
    }
  }
}

/* ---------- teletransporte ---------- */
const TP_COOLDOWN = 0;   // sin recarga: se puede encadenar

function validTarget(cx, cy){
  if (tileAt(cx, cy) !== EMPTY) return false;
  if (bombAt(cx, cy) || flameAt(cx, cy)) return false;
  if (enemies.some(e => cellOf(e.x) === cx && cellOf(e.y) === cy)) return false;
  return true;
}

const WARP_DUR = .34;                    // salida + llegada
const sfxTeleport = new Audio('sonidos/teleport.mp3');
sfxTeleport.volume = .55;
function sonarTeleport(){
  try { sfxTeleport.cloneNode(true).play().catch(() => {}); } catch(e){}
}

function doTeleport(p){
  const { cx, cy } = p.aim;
  if (!validTarget(cx, cy)){
    beep(110, .16, 'square', .05);        // destino inválido: sigue apuntando
    return;
  }
  p.aim = null;
  p.warp = { t: WARP_DUR, destino: { cx, cy }, saltado: false };
  p.tpCd = TP_COOLDOWN;
  p.invuln = Math.max(p.invuln, WARP_DUR + .6);

  // efecto de salida: el aire se lo traga
  rings.push({ x: p.x, y: p.y, t: .35, max: 30, c: p.color });
  for (let k = 0; k < 16; k++){
    const a = Math.random() * Math.PI * 2, d = 22 + Math.random() * 16;
    particles.push({ x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d,
                     vx: -Math.cos(a) * d * 3.2, vy: -Math.sin(a) * d * 3.2,
                     t: WARP_DUR / 2, c: p.color });
  }
  sonarTeleport();
}

// segunda mitad del salto: aparecer en el destino
function aterrizarWarp(p){
  const { cx, cy } = p.warp.destino;
  p.x = center(cx); p.y = center(cy);
  p.warp.saltado = true;
  rings.push({ x: p.x, y: p.y, t: .5, max: 42, c: '#ffffff' });
  rings.push({ x: p.x, y: p.y, t: .45, max: 30, c: p.color });
  for (let k = 0; k < 18; k++){
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 120;
    particles.push({ x: p.x, y: p.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, t: .45, c: '#cfe8ff' });
  }
  sonidoWarp(false);
}

function aimControl(p, dx, dy, dt){
  p.aimT -= dt;
  const key = dx + ',' + dy;
  if (!dx && !dy){ p.aimPrev = ''; p.aimT = 0; return; }
  if (p.aimPrev !== key || p.aimT <= 0){
    p.aim.cx = Math.max(1, Math.min(COLS - 2, p.aim.cx + dx));
    p.aim.cy = Math.max(1, Math.min(ROWS - 2, p.aim.cy + dy));
    p.aimT = p.aimPrev !== key ? .24 : .1;
    p.aimPrev = key;
    beep(1100, .03, 'square', .02);
  }
}

/* ---------- daño ---------- */
function killPlayer(p){
  if (!p.alive || p.invuln > 0 || p.dying > 0 || p.warp) return;
  p.aim = null;
  if (p.mount){          // la montura huye y te salva del golpe
    releaseMount(p);
    p.invuln = 1.8;
    beep(520, 0.18, 'square', 0.05);
    beep(300, 0.22, 'sine', 0.04);
    return;
  }
  p.alive = false; p.dying = 1.1; p.lives--;
  beep(220, 0.4, 'triangle', 0.06);
}

function checkHits(){
  for (const p of players){
    if (!p.alive) continue;
    if (flameAt(cellOf(p.x), cellOf(p.y))) { killPlayer(p); continue; }
    for (const e of enemies)
      if (e.alive && Math.hypot(e.x - p.x, e.y - p.y) < (ENEMY_KINDS[e.kind].radius || 24)){ killPlayer(p); break; }
  }
  for (const e of enemies){
    const enLlamas = ENEMY_KINDS[e.kind].size === 2
      ? [[-1,-1],[1,-1],[-1,1],[1,1]].some(([dx,dy]) => flameAt(cellOf(e.x + dx*TS/2), cellOf(e.y + dy*TS/2)))
      : flameAt(cellOf(e.x), cellOf(e.y));
    if (e.alive && enLlamas){
      e.alive = false;
      score += 100;
      beep(420, 0.15, 'square', 0.05);
      for (let k = 0; k < 10; k++)
        particles.push({ x: e.x, y: e.y, vx: (Math.random()-.5)*140,
                         vy: (Math.random()-.5)*140, t: .6, c: e.color });
    }
  }
  enemies = enemies.filter(e => e.alive);
}

function pickup(p){
  const cx = cellOf(p.x), cy = cellOf(p.y);
  const it = items[cy][cx];
  if (!it || it === 'exit' || grid[cy][cx] !== EMPTY) return;
  if (it === 'egg'){
    if (p.mount) return;                       // ya montas: el huevo se queda
    items[cy][cx] = null;
    p.mount = makeMount(MOUNT_KEYS[rnd(MOUNT_KEYS.length)]);
    score += 100;
    beep(520, .1, 'square', .05); beep(780, .14, 'square', .05);
    for (let k = 0; k < 12; k++)
      particles.push({ x: p.x, y: p.y, vx: (Math.random()-.5)*160,
                       vy: (Math.random()-.5)*160, t: .6, c: p.mount.color });
    return;
  }
  items[cy][cx] = null;
  if (it === 'bomb') p.maxBombs++;
  if (it === 'fire')  p.range++;
  if (it === 'speed') p.speed = Math.min(190, p.speed + 22);
  if (it === 'life'){
    p.lives = Math.min(6, p.lives + 1);
    p.maxLives = Math.max(p.maxLives || 3, p.lives);
    score += 150;
    beep(660, .1, 'sine', .05); beep(990, .16, 'sine', .05);
    for (let k = 0; k < 12; k++)
      particles.push({ x: p.x, y: p.y, vx: (Math.random()-.5)*130,
                       vy: -30 - Math.random()*90, t: .6, c: '#ff6b8a' });
  }
  if (it === 'spike'){
    p.spike = true;
    score += 150;
    beep(300, .08, 'sawtooth', .05); beep(520, .14, 'sawtooth', .04);
  }
  if (it === 'remote'){
    p.remote = true;
    score += 100;
    beep(440, .1, 'square', .05); beep(880, .14, 'square', .05);
  }
  score += 50;
  beep(660, 0.12, 'sine', 0.05);
}

const NIVELES_CAMPANA = 11;   // la campaña termina al superar este nivel

function tryExit(){
  if (enemies.length) return;
  for (const p of players){
    if (!p.alive) continue;
    const cx = cellOf(p.x), cy = cellOf(p.y);
    if (items[cy][cx] === 'exit' && grid[cy][cx] === EMPTY){
      score += 500 + Math.max(0, 300 - Math.floor(levelTimer) * 5);

      if (level >= NIVELES_CAMPANA){          // ¡completó los 11 niveles!
        victoriaFinal();
        return;
      }

      level++;
      buildLevel();
      resetPositions();
      levelTimer = 0;
      beep(880, 0.25, 'sine', 0.06);
      const aviso = level === 2 ? '<br><b>¡Ahora los enemigos se teletransportan!</b>'
                  : level === 4 ? '<br><b>¡Ahora también disparan rayos!</b>'
                  : level === 5 ? '<br><b>¡Cuidado: llegan el plátano y el resto de bichos!</b>'
                  : level === 11 ? '<br><b>Nivel final: un único Titán ocupa 4 casillas y atraviesa las paredes.</b>' : '';
      showOverlay('¡Nivel superado!', 'Nivel ' + level + ' — terreno: ' + TH().name + aviso, [{ txt: 'Seguir', act: () => { overlay.classList.add('hidden'); mode = 'play'; } }]);
      mode = 'paused';
      return;
    }
  }
}

     { txt: 'Menú principal', act: () => { location.href = '/menu.html'; }, ghost: true }],
    true);
}

/* ---------- salto corto de los enemigos (radio 3) ---------- */
const ENEMY_TP_RANGE = 3, ENEMY_TP_AVISO = .55;   // aviso antes de saltar

function elegirDestinoSalto(e){
  const cx = cellOf(e.x), cy = cellOf(e.y);
  const rango = (e.kind === 'banana' && level >= 9) ? 7 : (e.tpRange || ENEMY_TP_RANGE);
  const opts = [];
  for (let dy = -rango; dy <= rango; dy++)
    for (let dx = -rango; dx <= rango; dx++){
      if (!dx && !dy) continue;
      if (Math.abs(dx) + Math.abs(dy) > rango) continue;             // casillas a la redonda
      const nx = cx + dx, ny = cy + dy;
      if (tileAt(nx, ny) !== EMPTY) continue;
      if (bombAt(nx, ny) || flameAt(nx, ny)) continue;
      if (players.some(pl => pl.alive && cellOf(pl.x) === nx && cellOf(pl.y) === ny)) continue;
      if (enemies.some(o => o !== e && cellOf(o.x) === nx && cellOf(o.y) === ny)) continue;
      opts.push({ nx, ny });
    }
  if (!opts.length) return false;

  let t = opts[rnd(opts.length)];
  if (e.atkCd <= 1.2){                            // si tiene el rayo listo, busca línea de tiro
    const spots = firingSpots();
    const buenas = opts.filter(o => spots.has(o.ny * COLS + o.nx) && !dangerCell(o.nx, o.ny));
    if (buenas.length) return buenas[0];
  }
  if (e.smart){                                   // los rojos saltan hacia el jugador
    const target = players.filter(pl => pl.alive)
      .sort((a, b) => Math.hypot(a.x - e.x, a.y - e.y) - Math.hypot(b.x - e.x, b.y - e.y))[0];
    if (target)
      t = opts.slice().sort((a, b) =>
        Math.hypot(center(a.nx) - target.x, center(a.ny) - target.y) -
        Math.hypot(center(b.nx) - target.x, center(b.ny) - target.y))[0];
  }
  return t;
}

// ejecuta el salto hacia el destino ya anunciado
function enemyTeleport(e){
  const t = e.tpDestino;
  e.tpDestino = null;
  e.tpCd = ENEMY_KINDS[e.kind].tp() * factorSalto();
  if (!t || tileAt(t.nx, t.ny) !== EMPTY || flameAt(t.nx, t.ny)) return false;

  rings.push({ x: e.x, y: e.y, t: .45, max: 30, c: e.color });
  for (let k = 0; k < 8; k++){
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 70;
    particles.push({ x: e.x, y: e.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, t: .4, c: e.color });
  }
  e.x = center(t.nx); e.y = center(t.ny);
  rings.push({ x: e.x, y: e.y, t: .5, max: 34, c: e.color });
  for (let k = 0; k < 10; k++){
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 90;
    particles.push({ x: e.x, y: e.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, t: .4, c: '#ffffff' });
  }
  sonidoWarp(false, .035);
  return true;
}

/* ---------- rayo de energía de los enemigos ---------- */
const BEAM_RANGE = 3, BEAM_CHARGE = .7, BEAM_TIME = .45;

// ¿hay un jugador en línea recta, sin muros de por medio y a 3 o menos?
function beamRangeOf(e){
  return ENEMY_KINDS[e.kind].beamRange || BEAM_RANGE;
}

function beamAim(e){
  const cx = cellOf(e.x), cy = cellOf(e.y);
  const alcance = beamRangeOf(e);
  for (const p of players){
    if (!p.alive || p.dying > 0) continue;
    const px = cellOf(p.x), py = cellOf(p.y);
    let dx = 0, dy = 0, dist = 0;
    if (py === cy && px !== cx){ dx = Math.sign(px - cx); dist = Math.abs(px - cx); }
    else if (px === cx && py !== cy){ dy = Math.sign(py - cy); dist = Math.abs(py - cy); }
    else continue;
    if (dist > alcance) continue;
    let clear = true;
    for (let r = 1; r <= dist; r++)
      if (tileAt(cx + dx * r, cy + dy * r) !== EMPTY){ clear = false; break; }
    if (clear) return [dx, dy];
  }
  return null;
}

function fireBeam(e){
  const cx = cellOf(e.x), cy = cellOf(e.y);
  const [dx, dy] = e.chargeDir;
  const cells = [];
  for (let r = 1; r <= beamRangeOf(e); r++){
    const nx = cx + dx * r, ny = cy + dy * r;
    if (tileAt(nx, ny) !== EMPTY) break;          // los muros y bloques lo frenan
    cells.push({ cx: nx, cy: ny });
  }
  e.atkCd = ENEMY_KINDS[e.kind].atk();
  if (!cells.length) return;

  const leche = ENEMY_KINDS[e.kind].beam === 'milk';
  beams.push({ x: e.x, y: e.y, dx, dy, cells, t: leche ? BEAM_TIME * 1.3 : BEAM_TIME,
               style: leche ? 'milk' : 'energy',
               color: leche ? '#fffdf5' : e.smart ? '#ff9d6b' : '#7ee8ff' });
  for (let k = 0; k < 10; k++)
    particles.push({ x: e.x + dx * 14, y: e.y + dy * 14,
                     vx: dx * (60 + Math.random()*120) + (Math.random()-.5)*60,
                     vy: dy * (60 + Math.random()*120) + (Math.random()-.5)*60,
                     t: .4, c: e.smart ? '#ffd0a0' : '#cdf6ff' });
  if (leche){ beep(320, .3, 'triangle', .045); beep(140, .35, 'sine', .04); }
  else { beep(180, .22, 'sawtooth', .05); beep(90, .3, 'sine', .04); }
}

function beamHits(){
  for (const b of beams)
    for (const p of players){
      if (!p.alive) continue;
      const px = cellOf(p.x), py = cellOf(p.y);
      if (b.cells.some(c => c.cx === px && c.cy === py)) killPlayer(p);
    }
}

/* ---------- IA enemiga ---------- */
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

// casilla peligrosa: fuego, bomba o dentro del alcance de una bomba
function dangerCell(cx, cy){
  if (tileAt(cx, cy) !== EMPTY) return false;
  if (flameAt(cx, cy)) return true;
  for (const b of bombs){
    if (b.cx === cx && b.cy === cy) return true;
    if (b.cx !== cx && b.cy !== cy) continue;
    const dist = Math.abs(b.cx - cx) + Math.abs(b.cy - cy);
    if (dist > b.range) continue;
    const dx = Math.sign(cx - b.cx), dy = Math.sign(cy - b.cy);
    let libre = true;
    for (let r = 1; r < dist; r++)
      if (tileAt(b.cx + dx * r, b.cy + dy * r) !== EMPTY){ libre = false; break; }
    if (libre) return true;
  }
  return false;
}

// primer paso del camino más corto hasta una casilla que cumpla isGoal
function bfsDir(cx, cy, isGoal, evitarPeligro = true, atraviesaParedes = false){
  const key = (x, y) => y * COLS + x;
  if (isGoal(cx, cy)) return [0, 0];
  const prev = new Map([[key(cx, cy), null]]);
  const queue = [[cx, cy]];
  let found = null;
  for (let qi = 0; qi < queue.length && !found; qi++){
    const [x, y] = queue[qi];
    for (const [dx, dy] of DIRS){
      const nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      if (prev.has(k)) continue;
      if (!atraviesaParedes && (tileAt(nx, ny) !== EMPTY || bombAt(nx, ny))) continue;
      if (evitarPeligro && dangerCell(nx, ny)) continue;
      prev.set(k, [x, y]);
      if (isGoal(nx, ny)){ found = [nx, ny]; break; }
      queue.push([nx, ny]);
    }
  }
  if (!found) return null;
  let cur = found;
  while (true){
    const par = prev.get(key(cur[0], cur[1]));
    if (!par) return null;
    if (par[0] === cx && par[1] === cy) return [cur[0] - cx, cur[1] - cy];
    cur = par;
  }
}

// casillas desde las que se puede disparar a un jugador (en línea y sin muros)
function firingSpots(){
  const set = new Set();
  for (const p of players){
    if (!p.alive || p.dying > 0) continue;
    const px = cellOf(p.x), py = cellOf(p.y);
    for (const [dx, dy] of DIRS)
      for (let r = 1; r <= BEAM_RANGE + 1; r++){
        const nx = px + dx * r, ny = py + dy * r;
        if (tileAt(nx, ny) !== EMPTY) break;
        set.add(ny * COLS + nx);
      }
  }
  return set;
}

function playerCell(cx, cy){
  return players.some(p => p.alive && p.dying <= 0 &&
    cellOf(p.x) === cx && cellOf(p.y) === cy);
}

function enemyAI(e, dt){
  const conRayo = puedenDisparar(), conSalto = puedenSaltar();

  // rayo: cargando
  if (e.charge > 0){
    e.charge -= dt;
    if (e.charge <= 0) fireBeam(e);
    return;                                   // no se mueve mientras carga
  }
  e.atkCd -= dt;
  if (conRayo && e.atkCd <= 0){
    const d = beamAim(e);
    if (d){
      e.charge = ENEMY_KINDS[e.kind].chargeTime || BEAM_CHARGE;
      e.chargeMax = e.charge;
      e.chargeDir = d;
      e.dir = [0, 0];
      if (e.kind === 'banana'){ beep(180, .1, 'square', .03); beep(150, .16, 'square', .03); }
      else { beep(520, .12, 'sine', .03); beep(760, .18, 'sine', .03); }
      return;
    }
  }

  const cx = cellOf(e.x), cy = cellOf(e.y);
  const listoParaTirar = conRayo && e.atkCd <= 1.2;
  const enPeligro = dangerCell(cx, cy);

  // salto corto
  if (e.tpWarn > 0){
    e.tpWarn -= dt;
    if (e.tpWarn <= 0) enemyTeleport(e);
    return;                                   // mientras carga se queda quieto
  }
  if (conSalto && !ENEMY_KINDS[e.kind].noTp && (e.kind !== 'banana' || level >= 9)){
    e.tpCd -= dt;
    if (e.tpCd <= 0 || (enPeligro && e.tpCd < 3)){
      e.tpDestino = elegirDestinoSalto(e);
      if (!e.tpDestino){ e.tpCd = .6; return; }     // sin sitio: reintenta luego
      e.tpWarn = ENEMY_TP_AVISO;
      sonidoWarp(true, .022);
      return;
    }
  }

  e.think -= dt;
  const atCenter = Math.abs(e.x - center(cx)) < 2 && Math.abs(e.y - center(cy)) < 2;
  const moved = step(e, e.dir[0], e.dir[1], dt);

  if (!moved || (atCenter && e.think <= 0)){
    const torpe = torpeza();
    e.think = torpe === 2 ? .6 + Math.random() * .8
            : torpe === 1 ? .35 + Math.random() * .45
            : .18 + Math.random() * .25;
    let dir = null;

    if (torpe === 2){                          // nivel 1: dan tumbos y ni ven las bombas
      if (Math.random() < .18){ e.dir = [0, 0]; return; }   // a ratos se quedan parados
      const libres = DIRS.filter(([dx, dy]) => !blocked(cx + dx, cy + dy, e));
      e.dir = libres.length ? libres[rnd(libres.length)] : [0, 0];
      return;
    }

    if (torpe === 1 && Math.random() < .14){   // se quedan pensando
      e.dir = [0, 0];
      return;
    }

    // en el nivel 2 solo esquivan la bomba la mitad de las veces
    if (enPeligro && (torpe === 0 || Math.random() < .45)){
      dir = bfsDir(cx, cy, (x, y) => !dangerCell(x, y), false);
    }
    if (!dir && listoParaTirar && torpe === 0){ // buscar posición de tiro
      const spots = firingSpots();
      if (spots.size) dir = bfsDir(cx, cy, (x, y) => spots.has(y * COLS + x));
    }
    const ganasDePerseguir = torpe === 1 ? .2 : e.smart ? 1 : .4;
    if (!dir && Math.random() < ganasDePerseguir){
      dir = bfsDir(cx, cy, playerCell, true, !!ENEMY_KINDS[e.kind].phase);
    }
    if (!dir){                                 // 4º deambular
      const options = DIRS.filter(([dx, dy]) =>
        !blocked(cx + dx, cy + dy, e) && !dangerCell(cx + dx, cy + dy));
      dir = options.length ? options[rnd(options.length)] : [0, 0];
    }
    e.dir = dir;
  }
}

/* ---------- update ---------- */
function update(dt){
  levelTimer += dt;

  // jugadores
  // con un solo jugador las flechas y WASD valen igual
  const map = twoPlayers ? [
    { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'],
      bomb:[' '], tp:['q'], det:['e'] },
    { up:['w'], down:['s'], left:['a'], right:['d'],
      bomb:['Shift'], tp:['g'], det:['f'] }
  ] : [
    { up:['ArrowUp','w'], down:['ArrowDown','s'], left:['ArrowLeft','a'], right:['ArrowRight','d'],
      bomb:[' ','Shift'], tp:['q','g'], det:['e','f'] }
  ];
  const held = list => list.some(key => keys[key]);
  const take = list => {
    const hit = list.some(key => keys[key]);
    if (hit) list.forEach(key => { keys[key] = false; });
    return hit;
  };
  players.forEach((p, i) => {
    if (p.dying > 0){
      p.dying -= dt;
      if (p.dying <= 0 && p.lives > 0){
        p.x = center(p.spawn.cx); p.y = center(p.spawn.cy);
        p.alive = true; p.invuln = 2.2;
      }
      return;
    }
    if (!p.alive) return;
    p.invuln = Math.max(0, p.invuln - dt);
    p.tpCd = Math.max(0, p.tpCd - dt);

    if (p.warp){                               // en tránsito: ni se mueve ni le dan
      p.warp.t -= dt;
      if (!p.warp.saltado && p.warp.t <= WARP_DUR / 2) aterrizarWarp(p);
      if (p.warp.t <= 0) p.warp = null;
      return;
    }

    const k = map[i];
    let dx = (held(k.right) ? 1 : 0) - (held(k.left) ? 1 : 0);
    let dy = (held(k.down) ? 1 : 0) - (held(k.up) ? 1 : 0);
    if (dx && dy) dy = 0;                       // una dirección a la vez

    // Esc cancela la mira (tiene prioridad sobre la tecla de salto)
    if (p.aim && keys.Escape){ p.aim = null; keys.Escape = false; beep(200, .08, 'sine', .03); }

    // T: abre la mira; T otra vez: salta a la casilla marcada
    if (take(k.tp)){
      if (p.aim) doTeleport(p);
      else if (p.tpCd <= 0){
        p.aim = { cx: cellOf(p.x), cy: cellOf(p.y) };
        p.aimT = 0; p.aimPrev = '';
        beep(700, .07, 'sine', .04);
      } else beep(140, .12, 'square', .04);
    }

    if (take(k.det)) detonateRemote(p);

    if (p.aim){                                 // apuntando: el jugador no se mueve
      p.face = [0, 0];
      aimControl(p, dx, dy, dt);
      pickup(p);
      return;
    }

    p.face = [dx, dy];
    step(p, dx, dy, dt);
    kickBomb(p, dx, dy);
    if (p.mount && (dx || dy)) p.mount.face = dx ? Math.sign(dx) : p.mount.face;
    if (take(k.bomb)) placeBomb(p);
    pickup(p);

    // volver a montar una montura suelta
    if (!p.mount){
      const idx = mounts.findIndex(m => m.flee <= 0 && Math.hypot(m.x - p.x, m.y - p.y) < 22);
      if (idx >= 0){
        const m = mounts.splice(idx, 1)[0];
        p.mount = makeMount(m.type);
        beep(660, .12, 'square', .05);
      }
    }
  });

  // bombas
  slideBombs(dt);
  for (const b of bombs.slice()){
    if (!b.remote) b.t -= dt;
    // deja de ser atravesable cuando el dueño sale de la casilla
    for (const p of Array.from(b.pass))
      if (cellOf(p.x) !== b.cx || cellOf(p.y) !== b.cy) b.pass.delete(p);
    if (!b.slide){ b.x = center(b.cx); b.y = center(b.cy); }
    if (b.t <= 0) detonate(b);
  }

  // llamas
  flames = flames.filter(f => (f.t -= dt) > 0);

  // enemigos
  enemies.forEach(e => enemyAI(e, dt));

  // monturas sueltas: corretean, primero huyendo
  for (const m of mounts){
    m.flee = Math.max(0, m.flee - dt);
    m.speed = m.flee > 0 ? 150 : 78;
    const moved = step(m, m.dir[0], m.dir[1], dt);
    m.think -= dt;
    if (!moved || m.think <= 0){
      m.think = .3 + Math.random() * .6;
      const cx = cellOf(m.x), cy = cellOf(m.y);
      const opts = [[1,0],[-1,0],[0,1],[0,-1]]
        .filter(([dx, dy]) => !blocked(cx + dx, cy + dy, m) && !flameAt(cx + dx, cy + dy));
      if (opts.length) m.dir = opts[rnd(opts.length)];
    }
    if (m.dir[0]) m.face = Math.sign(m.dir[0]);
  }
  // el fuego las espanta del nivel
  mounts = mounts.filter(m => {
    if (m.flee > 0) return true;                 // invulnerable mientras escapa
    if (!flameAt(cellOf(m.x), cellOf(m.y))) return true;
    for (let k = 0; k < 10; k++)
      particles.push({ x: m.x, y: m.y, vx: (Math.random()-.5)*150,
                       vy: (Math.random()-.5)*150, t: .5, c: m.color });
    beep(240, .2, 'sine', .04);
    return false;
  });

  // rayos
  beams = beams.filter(b => (b.t -= dt) > 0);
  beamHits();

  // anillos del teletransporte
  rings = rings.filter(r => (r.t -= dt) > 0);

  // partículas
  particles = particles.filter(p => {
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt;
    return p.t > 0;
  });

  checkHits();
  tryExit();

  if (players.every(p => p.lives <= 0 && p.dying <= 0)){
    mode = 'over';
    showOverlay('Game Over', 'Puntuación final: ' + score + ' — llegaste al nivel ' + level,
      [{ txt: 'Reintentar', act: () => startGame(twoPlayers) },
       { txt: 'Menú', act: showMenu, ghost: true }]);
  }
}

// variación determinista por casilla
function hash(x, y){
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

// aclara (amt>0) u oscurece (amt<0) un color hex
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = amt > 0 ? 255 : 0, k = Math.abs(amt);
  r = Math.round(r + (t - r) * k);
  g = Math.round(g + (t - g) * k);
  b = Math.round(b + (t - b) * k);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function roundRectOn(dst, x, y, w, h, r){
  dst.beginPath();
  dst.moveTo(x + r, y);
  dst.arcTo(x + w, y, x + w, y + h, r);
  dst.arcTo(x + w, y + h, x, y + h, r);
  dst.arcTo(x, y + h, x, y, r);
  dst.arcTo(x, y, x + w, y, r);
  dst.closePath();
}
function roundRect(x, y, w, h, r){ roundRectOn(ctx, x, y, w, h, r); }
