let themeOverride = null;                 // modo desarrollo: escenario fijado a mano
let kindOverride = null;                  // modo desarrollo: forzar un tipo de enemigo
const TH = () => THEMES[(themeOverride != null ? themeOverride : level - 1) % THEMES.length];

function drawFloor(dst = ctx){
  const th = TH();
  const grad = dst.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, th.floorTop);
  grad.addColorStop(1, th.floorBot);
  dst.fillStyle = grad;
  dst.fillRect(0, 0, W, H);

  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++){
      const px = x * TS, py = y * TS;
      const h = hash(x, y);
      dst.fillStyle = ((x + y) % 2)
        ? 'rgba(255,255,255,.035)'
        : 'rgba(0,0,0,.10)';
      dst.fillRect(px, py, TS, TS);
      // manchas sutiles
      dst.fillStyle = 'rgba(' + th.spot + ',' + (0.02 + h * 0.03) + ')';
      dst.fillRect(px + 4 + h * 10, py + 6 + h * 12, 10 + h * 8, 5 + h * 5);
      dst.strokeStyle = 'rgba(0,0,0,.18)';
      dst.lineWidth = 1;
      dst.strokeRect(px + .5, py + .5, TS - 1, TS - 1);
    }

  dst.globalAlpha = .5;
  const pat = dst.createPattern(noiseTex, 'repeat');
  dst.fillStyle = pat;
  dst.fillRect(0, 0, W, H);
  dst.globalAlpha = 1;
}

function drawSolid(x, y, dst = ctx){
  const px = x * TS, py = y * TS;
  dst.fillStyle = 'rgba(0,0,0,.45)';
  dst.fillRect(px + 2, py + 5, TS, TS - 2);

  const th = TH();
  const grad = dst.createLinearGradient(px, py, px, py + TS);
  grad.addColorStop(0, th.solid[0]);
  grad.addColorStop(.45, th.solid[1]);
  grad.addColorStop(1, th.solid[2]);
  dst.fillStyle = grad;
  roundRectOn(dst, px + 1, py + 1, TS - 2, TS - 2, 5); dst.fill();

  dst.fillStyle = 'rgba(255,255,255,.18)';
  roundRectOn(dst, px + 4, py + 3, TS - 8, 6, 3); dst.fill();
  dst.fillStyle = 'rgba(0,0,0,.28)';
  roundRectOn(dst, px + 4, py + TS - 11, TS - 8, 7, 3); dst.fill();

  // remaches
  dst.fillStyle = 'rgba(255,255,255,.22)';
  [[7,7],[TS-7,7],[7,TS-7],[TS-7,TS-7]].forEach(([ox, oy]) => {
    dst.beginPath(); dst.arc(px + ox, py + oy, 1.6, 0, Math.PI * 2); dst.fill();
  });

  dst.strokeStyle = th.solidEdge;
  dst.lineWidth = 1.5;
  roundRectOn(dst, px + 1, py + 1, TS - 2, TS - 2, 5); dst.stroke();
}

function drawBrick(x, y, dst = ctx){
  const px = x * TS, py = y * TS;
  const h = hash(x * 3.1, y * 7.7);
  dst.fillStyle = 'rgba(0,0,0,.4)';
  dst.fillRect(px + 2, py + 4, TS - 2, TS - 3);

  const th = TH();
  const grad = dst.createLinearGradient(px, py, px, py + TS);
  grad.addColorStop(0, th.brick[0]);
  grad.addColorStop(1, th.brick[1]);
  dst.fillStyle = grad;
  roundRectOn(dst, px + 1.5, py + 1.5, TS - 3, TS - 3, 4); dst.fill();

  // hiladas de ladrillo
  dst.save();
  roundRectOn(dst, px + 1.5, py + 1.5, TS - 3, TS - 3, 4); dst.clip();
  for (let r = 0; r < 3; r++){
    const oy = py + 4 + r * 11.5;
    const off = r % 2 ? -8 : 0;
    for (let c = -1; c < 3; c++){
      const ox = px + 3 + off + c * 17;
      const tone = 0.06 + hash(x + c, y + r) * 0.14;
      dst.fillStyle = 'rgba(' + th.brickTone + ',' + tone + ')';
      roundRectOn(dst, ox, oy, 15, 9, 2); dst.fill();
      dst.fillStyle = 'rgba(0,0,0,.18)';
      dst.fillRect(ox, oy + 8.5, 15, 1.5);
    }
  }
  dst.fillStyle = 'rgba(255,255,255,.12)';
  dst.fillRect(px, py + 2, TS, 3);
  dst.fillStyle = 'rgba(0,0,0,' + (0.10 + h * 0.12) + ')';
  dst.fillRect(px, py + TS - 8, TS, 8);
  dst.restore();

  dst.strokeStyle = th.brickEdge;
  dst.lineWidth = 1.5;
  roundRectOn(dst, px + 1.5, py + 1.5, TS - 3, TS - 3, 4); dst.stroke();
}

function drawBomb(b){
  const x = b.x, y = b.y;
  const beat = b.remote
    ? 1 + Math.sin(T() * 7) * .05                       // a distancia: late suave, sin prisa
    : 1 + Math.sin(b.t * (b.t < 1 ? 26 : 14)) * (b.t < 1 ? .13 : .07);
  const r = 13 * beat;

  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(x, y + 13, r * .95, r * .35, 0, 0, Math.PI * 2); ctx.fill();

  if (b.pierce){                       // corona de pinchos
    ctx.fillStyle = '#9fe8ef';
    for (let i = 0; i < 10; i++){
      const a = (i / 10) * Math.PI * 2 + Math.sin(T() * 2) * .1;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * (r + 6), y + Math.sin(a) * (r + 6));
      ctx.lineTo(x + Math.cos(a + .28) * (r - 1), y + Math.sin(a + .28) * (r - 1));
      ctx.lineTo(x + Math.cos(a - .28) * (r - 1), y + Math.sin(a - .28) * (r - 1));
      ctx.closePath(); ctx.fill();
    }
  }

  // color del cuerpo: negro de siempre, naranja con espinas, rojo si además es de detonador
  const tono = (b.pierce && b.remote) ? ['#ff5c3d','#c0392b','#2a0402']
             : b.pierce               ? ['#ffb02e','#c0392b','#2a1704']
             :                          ['#3a3d47','#101116','#000000'];
  const g = ctx.createRadialGradient(x - 5, y - 6, 2, x, y, r);
  g.addColorStop(0, tono[0]);
  g.addColorStop(.45, tono[1]);
  g.addColorStop(1, tono[2]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(x - 4.5, y - 5, 3.6, 2.4, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(x, y, r - 2, .7, 2.1); ctx.stroke();

  // casquillo
  ctx.fillStyle = '#4b4f5e';
  roundRect(x - 4, y - r - 3, 8, 6, 2); ctx.fill();

  if (b.remote){                       // antena y piloto rojo: espera tu señal
    ctx.strokeStyle = '#cfd6ea'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y - r - 3); ctx.lineTo(x + 5, y - r - 13); ctx.stroke();
    const on = Math.sin(T() * 9) > 0;
    ctx.fillStyle = on ? '#ff5c5c' : '#5c2020';
    ctx.beginPath(); ctx.arc(x + 5.4, y - r - 14, 2.4, 0, Math.PI * 2); ctx.fill();
    if (on){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(x + 5.4, y - r - 14, 0, x + 5.4, y - r - 14, 9);
      gg.addColorStop(0, 'rgba(255,92,92,.6)'); gg.addColorStop(1, 'rgba(255,92,92,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x + 5.4, y - r - 14, 9, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    return;
  }

  // mecha normal
  ctx.strokeStyle = '#c9a15a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 1, y - r - 2);
  ctx.quadraticCurveTo(x + 11, y - r - 8, x + 7, y - r - 15);
  ctx.stroke();

  const sp = 0.6 + Math.abs(Math.sin(T() * 22)) * 0.6;
  const fg = ctx.createRadialGradient(x + 7, y - r - 16, 0, x + 7, y - r - 16, 8 * sp);
  fg.addColorStop(0, 'rgba(255,255,220,.95)');
  fg.addColorStop(.4, 'rgba(255,170,50,.75)');
  fg.addColorStop(1, 'rgba(255,120,0,0)');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.arc(x + 7, y - r - 16, 8 * sp, 0, Math.PI * 2); ctx.fill();
}

function drawFlame(f){
  const px = f.cx * TS, py = f.cy * TS;
  const k = Math.max(0, Math.min(1, f.t / FLAME_TIME));
  const grow = f.t > FLAME_TIME - .07 ? (FLAME_TIME - f.t) / .07 : 1;
  const s = Math.min(1, grow) * (0.78 + k * 0.22);
  const cx = px + TS / 2, cy = py + TS / 2;
  const p = 1 - k;                                   // 0 al nacer → 1 al apagarse
  const wob = Math.sin(T() * 26 + f.cx * 2 + f.cy) * 1.6;

  // humo que sube y se abre
  ctx.save();
  for (let i = 0; i < 3; i++){
    const a = i * 2.1 + f.cx + f.cy;
    ctx.fillStyle = 'rgba(70,60,55,' + (.22 * p * k + .05) + ')';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * p * 10, cy - p * 16 + Math.sin(a) * 4,
            5 + p * 9 + i * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // resplandor amplio
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, TS * 1.25 * s);
  glow.addColorStop(0, 'rgba(255,190,90,' + (.55 * k + .25) + ')');
  glow.addColorStop(.5, 'rgba(255,120,30,' + (.28 * k) + ')');
  glow.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(px - TS * 1.3, py - TS * 1.3, TS * 3.6, TS * 3.6);

  // onda expansiva desde el foco
  if (f.core){
    const rr = TS * (.3 + p * 1.5);
    ctx.strokeStyle = 'rgba(255,235,190,' + (.55 * k * k) + ')';
    ctx.lineWidth = 7 * k + 1;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,150,60,' + (.3 * k) + ')';
    ctx.lineWidth = 3 * k + 1;
    ctx.beginPath(); ctx.arc(cx, cy, rr * .72, 0, Math.PI * 2); ctx.stroke();
  }

  // cuerpo: cruz que llena la casilla
  const horiz = f.core || Math.abs(f.dx || 0) > 0;
  const vert  = f.core || Math.abs(f.dy || 0) > 0;
  const long  = TS / 2 + 1;
  const thick = (TS / 2) * s * .92 + wob;
  const hw = horiz ? long : thick;
  const hh = vert  ? long : thick;

  const layers = [
    [1.00, 'rgba(255,95,10,.82)'],
    [0.76, 'rgba(255,160,40,.90)'],
    [0.50, 'rgba(255,228,125,.94)'],
    [0.27, 'rgba(255,253,232,.97)']
  ];
  for (const [f2, col] of layers){
    ctx.fillStyle = col;
    roundRect(cx - hw * f2, cy - hh * f2, hw * 2 * f2, hh * 2 * f2, 10 * f2 + 3);
    ctx.fill();
  }

  // remate redondo al final del brazo
  if (f.end && !f.core){
    const ex = f.dx || 0, ey = f.dy || 0;
    ctx.fillStyle = 'rgba(255,200,90,' + (.75 * k) + ')';
    ctx.beginPath();
    ctx.arc(cx + ex * (TS / 2 - 5), cy + ey * (TS / 2 - 5), 9 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // brasas disparadas
  ctx.fillStyle = 'rgba(255,225,150,' + (.75 * k) + ')';
  for (let i = 0; i < 5; i++){
    const a = (i / 5) * Math.PI * 2 + f.cx + f.cy;
    const d = p * TS * (.7 + (i % 3) * .25);
    const tam = 2.6 * k + .6;
    ctx.fillRect(cx + Math.cos(a) * d - tam / 2, cy + Math.sin(a) * d - p * 10 - tam / 2, tam, tam);
  }

  // espinas: pinchos que salen de la llama
  if (f.spike){
    ctx.fillStyle = 'rgba(210,255,255,' + (.55 + k * .35) + ')';
    const pinchos = f.core ? 8 : 6;
    for (let i = 0; i < pinchos; i++){
      const a = (i / pinchos) * Math.PI * 2 + T() * 2;
      const largo = (TS * .55) * s * (.6 + (i % 2) * .4);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * largo, cy + Math.sin(a) * largo);
      ctx.lineTo(cx + Math.cos(a + .22) * largo * .35, cy + Math.sin(a + .22) * largo * .35);
      ctx.lineTo(cx + Math.cos(a - .22) * largo * .35, cy + Math.sin(a - .22) * largo * .35);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawItem(x, y, it){
  const px = x * TS, py = y * TS, cx = px + TS / 2, cy = py + TS / 2;
  const bob = Math.sin(T() * 3 + x + y) * 1.8;
  const pulse = .5 + Math.sin(T() * 4 + x) * .5;

  if (it === 'exit'){
    const open = enemies.length === 0;
    const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, TS * (open ? .9 : .6));
    glow.addColorStop(0, open ? 'rgba(120,255,190,.55)' : 'rgba(255,210,90,.30)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(px - TS / 2, py - TS / 2, TS * 2, TS * 2);

    ctx.fillStyle = '#11151f';
    roundRect(px + 7, py + 6, TS - 14, TS - 12, 4); ctx.fill();
    const dg = ctx.createLinearGradient(px, py, px, py + TS);
    dg.addColorStop(0, open ? '#7effc4' : '#f0c04a');
    dg.addColorStop(1, open ? '#25a97a' : '#a97b1f');
    ctx.fillStyle = dg;
    roundRect(px + 9, py + 8, TS - 18, TS - 16, 3); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(cx - 5, cy + 1, 10, TS / 2 - 9);
    ctx.beginPath(); ctx.arc(cx, cy + 1, 5, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2;
    roundRect(px + 9, py + 8, TS - 18, TS - 16, 3); ctx.stroke();
    return;
  }

  if (it === 'egg'){
    const glow2 = ctx.createRadialGradient(cx, cy + bob, 2, cx, cy + bob, TS * .8);
    glow2.addColorStop(0, 'rgba(255,255,255,' + (.16 + pulse * .2) + ')');
    glow2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow2;
    ctx.fillRect(px - TS / 2, py - TS / 2, TS * 2, TS * 2);

    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.ellipse(cx, py + TS - 7, 9, 3, 0, 0, Math.PI * 2); ctx.fill();

    const eg = ctx.createLinearGradient(cx - 8, cy - 12 + bob, cx + 8, cy + 12 + bob);
    eg.addColorStop(0, '#ffffff'); eg.addColorStop(1, '#cfd8e8');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.ellipse(cx, cy + bob, 10, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(20,26,40,.5)'; ctx.lineWidth = 1.4; ctx.stroke();
    // manchas
    ctx.fillStyle = '#5ddc7a';
    [[-4,-3,3],[3,1,2.6],[-2,6,2.2],[5,-6,2]].forEach(([ox, oy, r]) => {
      ctx.beginPath(); ctx.arc(cx + ox, cy + oy + bob, r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.beginPath(); ctx.ellipse(cx - 4, cy - 7 + bob, 2.6, 1.6, -.5, 0, Math.PI * 2); ctx.fill();
    return;
  }

  const tint = it === 'bomb' ? '#dfe4ff' : it === 'fire' ? '#ff8a3d'
             : it === 'remote' ? '#ff5c5c' : it === 'life' ? '#ff6b8a'
             : it === 'spike' ? '#9fe8ef' : '#5ecbff';
  const glow = ctx.createRadialGradient(cx, cy + bob, 2, cx, cy + bob, TS * .75);
  glow.addColorStop(0, 'rgba(255,255,255,' + (.18 + pulse * .18) + ')');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(px - TS / 2, py - TS / 2, TS * 2, TS * 2);

  // cápsula
  const cg = ctx.createLinearGradient(px, py + bob, px, py + TS + bob);
  cg.addColorStop(0, '#2a3350');
  cg.addColorStop(1, '#131a2b');
  ctx.fillStyle = cg;
  roundRect(px + 6, py + 6 + bob, TS - 12, TS - 12, 8); ctx.fill();
  ctx.strokeStyle = tint; ctx.lineWidth = 1.8;
  roundRect(px + 6, py + 6 + bob, TS - 12, TS - 12, 8); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  roundRect(px + 9, py + 9 + bob, TS - 18, 6, 3); ctx.fill();

  ctx.save();
  ctx.translate(cx, cy + bob);
  if (it === 'bomb'){
    ctx.fillStyle = '#e9ecff';
    ctx.beginPath(); ctx.arc(0, 1.5, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffb02e'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(4, -4); ctx.quadraticCurveTo(8, -9, 5, -11); ctx.stroke();
  } else if (it === 'fire'){
    ctx.fillStyle = '#ff7a2f';
    ctx.beginPath();
    ctx.moveTo(0, -9); ctx.quadraticCurveTo(7, -2, 5, 4);
    ctx.quadraticCurveTo(4, 9, 0, 9); ctx.quadraticCurveTo(-4, 9, -5, 4);
    ctx.quadraticCurveTo(-7, -2, 0, -9); ctx.fill();
    ctx.fillStyle = '#ffdc6a';
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.quadraticCurveTo(3.5, 2, 2.5, 5);
    ctx.quadraticCurveTo(2, 8, 0, 8); ctx.quadraticCurveTo(-2, 8, -2.5, 5);
    ctx.quadraticCurveTo(-3.5, 2, 0, -2); ctx.fill();
  } else if (it === 'spike'){
    ctx.fillStyle = '#9fe8ef';
    for (let i = 0; i < 8; i++){
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 11, Math.sin(a) * 11);
      ctx.lineTo(Math.cos(a + .3) * 5, Math.sin(a + .3) * 5);
      ctx.lineTo(Math.cos(a - .3) * 5, Math.sin(a - .3) * 5);
      ctx.closePath(); ctx.fill();
    }
    const bg2 = ctx.createRadialGradient(-2, -2, 1, 0, 0, 6.5);
    bg2.addColorStop(0, '#5b6070'); bg2.addColorStop(1, '#12131a');
    ctx.fillStyle = bg2;
    ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(-2, -2.4, 1.6, 0, Math.PI * 2); ctx.fill();
  } else if (it === 'life'){
    const latido = 1 + Math.sin(T() * 6) * .08;
    ctx.scale(latido, latido);
    const hg = ctx.createLinearGradient(0, -8, 0, 8);
    hg.addColorStop(0, '#ff9db1'); hg.addColorStop(1, '#d61f45');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-10, 0, -7, -9, 0, -4);
    ctx.bezierCurveTo(7, -9, 10, 0, 0, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,10,25,.6)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.ellipse(-3.2, -2.6, 1.8, 1.2, -.5, 0, Math.PI * 2); ctx.fill();
  } else if (it === 'remote'){
    // detonador de émbolo con antena
    ctx.fillStyle = '#3a3f55';
    roundRect(-7, -1, 14, 9, 2); ctx.fill();
    ctx.fillStyle = '#5a6079';
    roundRect(-7, -1, 14, 3, 1.5); ctx.fill();
    ctx.fillStyle = '#ff5c5c';
    roundRect(-3.5, -6, 7, 5, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    roundRect(-3.5, -6, 7, 2, 1); ctx.fill();
    ctx.strokeStyle = '#cfd6ea'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(6, -1); ctx.lineTo(9, -9); ctx.stroke();
    ctx.fillStyle = '#ff5c5c';
    ctx.beginPath(); ctx.arc(9.4, -10, 1.8, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#5ecbff';
    ctx.beginPath();
    ctx.moveTo(2, -10); ctx.lineTo(-6, 1); ctx.lineTo(-1, 1);
    ctx.lineTo(-2, 10); ctx.lineTo(6, -2); ctx.lineTo(1, -2); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* personaje: cuerpo con volumen, casco, ojos que miran y balanceo al andar */
function drawChar(ent, x, y, color, dir, opts = {}){
  const moving = !!(dir && (dir[0] || dir[1]));
  ent._anim = (ent._anim || 0) + (moving ? 0.16 : -(ent._anim || 0) * 0.2);
  const bob = moving ? Math.sin(ent._anim * 2) * 2 : Math.sin(T() * 2.5) * 0.8;
  const squash = moving ? 1 + Math.sin(ent._anim * 4) * 0.05 : 1;
  const yy = y + bob;

  if (opts.alpha != null) ctx.globalAlpha = opts.alpha;

  // sombra
  if (!opts.noShadow){
    ctx.fillStyle = 'rgba(0,0,0,.42)';
    ctx.beginPath(); ctx.ellipse(x, y + 14, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  // pies
  if (!opts.noShadow) ctx.fillStyle = 'rgba(20,22,32,.9)';
  else ctx.fillStyle = 'rgba(20,22,32,0)';
  const sw = moving ? Math.sin(ent._anim * 4) * 3 : 0;
  ctx.beginPath(); ctx.ellipse(x - 5 + sw, y + 12, 4.2, 2.8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 5 - sw, y + 12, 4.2, 2.8, 0, 0, Math.PI * 2); ctx.fill();

  // cuerpo
  const g = ctx.createLinearGradient(x, yy - 13, x, yy + 13);
  g.addColorStop(0, shade(color, .35));
  g.addColorStop(.55, color);
  g.addColorStop(1, shade(color, -.45));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(x, yy, 12.5 / squash, 13 * squash, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(8,10,16,.6)'; ctx.lineWidth = 1.6; ctx.stroke();
  // brillo especular
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.ellipse(x - 5, yy - 7, 4.2, 2.8, -0.5, 0, Math.PI * 2); ctx.fill();

  if (opts.enemy){
    // cuernitos
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 6, yy - 11); ctx.lineTo(x - 9, yy - 17);
    ctx.moveTo(x + 6, yy - 11); ctx.lineTo(x + 9, yy - 17);
    ctx.stroke();
    ctx.fillStyle = '#fff8d0';
    ctx.beginPath(); ctx.arc(x - 9, yy - 18, 1.8, 0, Math.PI * 2);
    ctx.arc(x + 9, yy - 18, 1.8, 0, Math.PI * 2); ctx.fill();
  } else {
    // casco blanco (solo la parte alta) con antena
    ctx.save();
    ctx.beginPath(); ctx.ellipse(x, yy, 12.5, 13, 0, 0, Math.PI * 2); ctx.clip();
    const hg = ctx.createLinearGradient(x, yy - 13, x, yy - 4);
    hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, '#c9d2e8');
    ctx.fillStyle = hg;
    ctx.fillRect(x - 13, yy - 14, 26, 8.5);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(x - 13, yy - 6.2, 26, 1.6);
    ctx.restore();
    ctx.strokeStyle = shade(color, -.3); ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, yy - 12.5); ctx.lineTo(x + 1, yy - 18); ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x + 1, yy - 19, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  // ojos
  const ox = (dir?.[0] || 0) * 2.2, oy = (dir?.[1] || 0) * 1.8;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(x - 4.4 + ox * .4, yy + .5 + oy * .4, 4, 4.6, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 4.4 + ox * .4, yy + .5 + oy * .4, 4, 4.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#10121c';
  ctx.beginPath();
  ctx.arc(x - 4.4 + ox, yy + .5 + oy, 2.1, 0, Math.PI * 2);
  ctx.arc(x + 4.4 + ox, yy + .5 + oy, 2.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath();
  ctx.arc(x - 5.2 + ox, yy - .5 + oy, .8, 0, Math.PI * 2);
  ctx.arc(x + 3.6 + ox, yy - .5 + oy, .8, 0, Math.PI * 2);
  ctx.fill();

  if (opts.enemy){ // ceño enfadado
    ctx.strokeStyle = 'rgba(10,10,16,.8)'; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(x - 8.5, yy - 5); ctx.lineTo(x - 1.5, yy - 2.2);
    ctx.moveTo(x + 8.5, yy - 5); ctx.lineTo(x + 1.5, yy - 2.2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* yoshi: cuerpo, cabeza, cresta, cola y patitas */
function drawMount(m, x, y, opts = {}){
  const face = m.face || 1;
  m.anim = (m.anim || 0) + (opts.moving ? .18 : -(m.anim || 0) * .2);
  const bob = opts.moving ? Math.sin(m.anim * 2) * 1.6 : Math.sin(T() * 2.2) * .6;
  const yy = y + bob;
  const c = m.color;

  if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
  const sc = opts.ridden ? 1.15 : 1;
  ctx.save();
  ctx.translate(x, yy);
  ctx.scale(face * sc, sc);

  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.beginPath(); ctx.ellipse(0, 13 - bob, 13, 4, 0, 0, Math.PI * 2); ctx.fill();

  // patas
  const sw = opts.moving ? Math.sin(m.anim * 4) * 3 : 0;
  ctx.fillStyle = shade(c, -.35);
  ctx.beginPath(); ctx.ellipse(-4 + sw, 10, 4.5, 3.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5 - sw, 10, 4.5, 3.2, 0, 0, Math.PI * 2); ctx.fill();

  // cola
  ctx.fillStyle = shade(c, -.2);
  ctx.beginPath();
  ctx.moveTo(-7, 2); ctx.quadraticCurveTo(-16, 2, -15, -6);
  ctx.quadraticCurveTo(-11, -1, -6, -2); ctx.fill();

  // cuerpo
  const bg = ctx.createLinearGradient(0, -10, 0, 12);
  bg.addColorStop(0, shade(c, .3));
  bg.addColorStop(.6, c);
  bg.addColorStop(1, shade(c, -.4));
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 2, 11.5, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(8,10,16,.5)'; ctx.lineWidth = 1.4; ctx.stroke();
  // barriga
  ctx.fillStyle = 'rgba(255,245,220,.85)';
  ctx.beginPath(); ctx.ellipse(1.5, 5.5, 7, 4.5, 0, 0, Math.PI * 2); ctx.fill();

  // cuello y cabeza
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(7, -4, 5.5, 7, -.35, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -10.5, 7.5, 6.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(8,10,16,.45)'; ctx.lineWidth = 1.2; ctx.stroke();
  // hocico
  ctx.fillStyle = shade(c, .18);
  ctx.beginPath(); ctx.ellipse(17.5, -9, 4.6, 3.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(10,12,20,.75)';
  ctx.beginPath(); ctx.arc(19.5, -10.5, 1, 0, Math.PI * 2); ctx.fill();

  // cresta
  ctx.fillStyle = shade(c, -.25);
  ctx.beginPath();
  ctx.moveTo(6, -14); ctx.quadraticCurveTo(8, -20, 13, -18);
  ctx.quadraticCurveTo(9, -16, 8.5, -13); ctx.fill();

  // ojo
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(13, -13, 3.5, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#10121c';
  ctx.beginPath(); ctx.arc(14.2, -13, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(13.5, -13.9, .8, 0, Math.PI * 2); ctx.fill();

  // silla cuando lleva jinete
  if (opts.ridden){
    ctx.fillStyle = '#8d5a33';
    roundRect(-8, -8.5, 12, 5, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    roundRect(-8, -8.5, 12, 2, 1); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawAim(p){
  const { cx, cy } = p.aim;
  const x = center(cx), y = center(cy);
  const ok = validTarget(cx, cy);
  const col = ok ? '#7effc4' : '#ff6b6b';
  const pulse = .55 + Math.sin(T() * 7) * .45;

  // línea punteada desde el jugador
  ctx.save();
  ctx.setLineDash([5, 6]);
  ctx.lineDashOffset = -T() * 22;
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(x, y); ctx.stroke();
  ctx.restore();

  // halo
  const g = ctx.createRadialGradient(x, y, 2, x, y, TS * .85);
  g.addColorStop(0, (ok ? 'rgba(126,255,196,' : 'rgba(255,107,107,') + (.20 + pulse * .18) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - TS, y - TS, TS * 2, TS * 2);

  // marco con esquinas
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.globalAlpha = .35 + pulse * .5;
  const h = TS / 2 - 3, arm = 8;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sy]) => {
    ctx.beginPath();
    ctx.moveTo(x + sx * h - sx * arm, y + sy * h);
    ctx.lineTo(x + sx * h, y + sy * h);
    ctx.lineTo(x + sx * h, y + sy * h - sy * arm);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // cruz central
  ctx.strokeStyle = col; ctx.lineWidth = 1.4;
  ctx.globalAlpha = .5 + pulse * .5;
  ctx.beginPath();
  ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y);
  ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // silueta fantasma del destino
  if (ok){
    ctx.globalAlpha = .35 + pulse * .2;
    drawChar(p, x, y, p.color, [0, 0], { noShadow: true, alpha: .45 });
    ctx.globalAlpha = 1;
  }
}

function drawMilk(b){
  const dur = BEAM_TIME * 1.3;
  const k = Math.max(0, Math.min(1, b.t / dur));
  const grow = b.t > dur - .1 ? (dur - b.t) / .1 : 1;
  const g0 = Math.min(1, grow);
  const last = b.cells[b.cells.length - 1];
  const x0 = b.x + b.dx * 9, y0 = b.y + b.dy * 9;
  const x1 = center(last.cx) + b.dx * (TS / 2 - 3);
  const y1 = center(last.cy) + b.dy * (TS / 2 - 3);
  const ex = x0 + (x1 - x0) * g0, ey = y0 + (y1 - y0) * g0;
  const largo = Math.hypot(ex - x0, ey - y0);
  const ancho = 13 * (0.6 + k * 0.4);

  ctx.save();
  ctx.translate(x0, y0);
  ctx.rotate(Math.atan2(ey - y0, ex - x0));

  // chorro con borde ondulado
  ctx.fillStyle = 'rgba(255,253,245,' + (.55 + k * .4) + ')';
  ctx.beginPath();
  ctx.moveTo(0, -ancho * .45);
  for (let x = 0; x <= largo; x += 6){
    const w = ancho * (.45 + x / largo * .35) + Math.sin(x * .25 + T() * 18) * 1.8;
    ctx.lineTo(x, -w);
  }
  for (let x = largo; x >= 0; x -= 6){
    const w = ancho * (.45 + x / largo * .35) + Math.sin(x * .25 + T() * 18 + 1.7) * 1.8;
    ctx.lineTo(x, w);
  }
  ctx.closePath(); ctx.fill();

  // brillo central
  ctx.fillStyle = 'rgba(255,255,255,' + (.75 * k) + ')';
  ctx.beginPath();
  ctx.moveTo(0, -ancho * .18);
  ctx.lineTo(largo, -ancho * .3);
  ctx.lineTo(largo, ancho * .1);
  ctx.lineTo(0, ancho * .05);
  ctx.closePath(); ctx.fill();

  // salpicadura final
  ctx.fillStyle = 'rgba(255,253,245,' + (.8 * k) + ')';
  ctx.beginPath(); ctx.arc(largo, 0, ancho * .6, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 5; i++){
    const a = (i / 5) * Math.PI * 2 + T() * 3;
    const r = ancho * (.7 + Math.random() * .6);
    ctx.beginPath();
    ctx.arc(largo + Math.cos(a) * r, Math.sin(a) * r, 1.6 + Math.random() * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  // gotas por el camino
  ctx.fillStyle = 'rgba(255,255,255,' + (.6 * k) + ')';
  for (let i = 0; i < 4; i++){
    const t2 = Math.random() * largo;
    ctx.beginPath();
    ctx.arc(t2, (Math.random() - .5) * ancho * 2.2, 1.4 + Math.random() * 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBeam(b){
  if (b.style === 'milk') return drawMilk(b);
  const k = Math.max(0, Math.min(1, b.t / BEAM_TIME));
  const grow = b.t > BEAM_TIME - .08 ? (BEAM_TIME - b.t) / .08 : 1;
  const g0 = Math.min(1, grow);
  const last = b.cells[b.cells.length - 1];
  const x0 = b.x + b.dx * 10, y0 = b.y + b.dy * 10;
  const x1 = center(last.cx) + b.dx * (TS / 2 - 4);
  const y1 = center(last.cy) + b.dy * (TS / 2 - 4);
  const ex = x0 + (x1 - x0) * g0, ey = y0 + (y1 - y0) * g0;
  const w = (12 + Math.sin(T() * 40) * 2) * (0.55 + k * 0.45);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  // resplandor a lo largo del rayo
  const gl = ctx.createLinearGradient(x0, y0, ex, ey);
  gl.addColorStop(0, b.color); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalAlpha = .35 * k;
  ctx.strokeStyle = gl; ctx.lineWidth = w * 3;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ex, ey); ctx.stroke();

  // capas del haz
  ctx.globalAlpha = .9 * k;
  ctx.strokeStyle = b.color; ctx.lineWidth = w * 1.6;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = w * .7;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ex, ey); ctx.stroke();

  // bola de salida y punta
  ctx.fillStyle = b.color; ctx.globalAlpha = .8 * k;
  ctx.beginPath(); ctx.arc(x0, y0, w * 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(ex, ey, w * .9, 0, Math.PI * 2); ctx.fill();

  // chispas en el borde
  ctx.globalAlpha = .5 * k;
  for (let i = 0; i < 5; i++){
    const t2 = Math.random();
    const px2 = x0 + (ex - x0) * t2 + (Math.random()-.5) * w * 2.2 * Math.abs(b.dy || 1);
    const py2 = y0 + (ey - y0) * t2 + (Math.random()-.5) * w * 2.2 * Math.abs(b.dx || 1);
    ctx.fillRect(px2, py2, 2.5, 2.5);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawCharge(e){
  const k = 1 - e.charge / (e.chargeMax || BEAM_CHARGE);
  const [dx, dy] = e.chargeDir;

  if (ENEMY_KINDS[e.kind].beam === 'milk'){         // el plátano gotea antes del chorro
    const x = e.x + dx * 14, y = e.y + dy * 14;
    ctx.save();
    ctx.fillStyle = 'rgba(255,253,245,.9)';
    ctx.beginPath(); ctx.arc(x, y, 2 + k * 5, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 3; i++){
      const a = T() * 5 + i * 2.1;
      ctx.globalAlpha = .5 + k * .4;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * (6 + k * 4), y + Math.sin(a) * (6 + k * 4), 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = .16 + k * .25;
    ctx.strokeStyle = '#fffdf5'; ctx.lineWidth = 5;
    ctx.setLineDash([7, 9]); ctx.lineDashOffset = -T() * 34;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + dx * TS * beamRangeOf(e), y + dy * TS * beamRangeOf(e));
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
    return;
  }
  const x = e.x + dx * 15, y = e.y + dy * 15;
  const r = 3 + k * 9;
  const col = e.smart ? '#ff9d6b' : '#7ee8ff';

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 1, x, y, r * 2.4);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.35, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.arc(x, y, r * .55, 0, Math.PI * 2); ctx.fill();

  // anillo que se cierra sobre la bola
  ctx.strokeStyle = col; ctx.globalAlpha = .7;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r + (1 - k) * 16, 0, Math.PI * 2); ctx.stroke();

  // línea de aviso hacia donde disparará
  ctx.globalAlpha = .18 + k * .22;
  ctx.strokeStyle = col; ctx.lineWidth = 4;
  ctx.setLineDash([6, 8]); ctx.lineDashOffset = -T() * 30;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + dx * TS * beamRangeOf(e), y + dy * TS * beamRangeOf(e));
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* titán: ocupa un bloque de 2x2 casillas, con núcleo pulsante */
function drawTitan(e){
  const x = e.x, y = e.y;
  e.anim = (e.anim || 0) + .05;
  const r = TS * (0.98 + Math.sin(e.anim) * .04);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(x, y, 4, x, y, r * 1.5);
  const rgb = e.glow || '170,90,255';
  gl.addColorStop(0, 'rgba(' + rgb + ',.5)');
  gl.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, y, r * 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(x, y + r * .9, r * .8, r * .28, 0, 0, Math.PI * 2); ctx.fill();

  const g = ctx.createRadialGradient(x - r*.3, y - r*.3, 4, x, y, r);
  g.addColorStop(0, '#c9a6ff'); g.addColorStop(.55, e.color); g.addColorStop(1, '#2a0f52');
  ctx.fillStyle = g;
  roundRect(x - r, y - r, r * 2, r * 2, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3; ctx.stroke();

  // grietas
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - r*.5, y - r*.7); ctx.lineTo(x - r*.1, y - r*.1); ctx.lineTo(x - r*.5, y + r*.5);
  ctx.moveTo(x + r*.6, y - r*.6); ctx.lineTo(x + r*.15, y);
  ctx.stroke();

  // ojo/núcleo
  const dirx = (e.dir?.[0] || 0), diry = (e.dir?.[1] || 0);
  const pulso = .7 + Math.abs(Math.sin(e.anim * 1.6)) * .3;
  const eg = ctx.createRadialGradient(x + dirx*6, y + diry*6, 0, x + dirx*6, y + diry*6, r * .32 * pulso);
  eg.addColorStop(0, '#fff2ff'); eg.addColorStop(.5, '#ff5cf0'); eg.addColorStop(1, 'rgba(255,92,240,0)');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(x + dirx*6, y + diry*6, r * .32 * pulso, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a0f52';
  ctx.beginPath(); ctx.arc(x + dirx*6, y + diry*6, r * .12, 0, Math.PI * 2); ctx.fill();
}

function drawRings(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings){
    const k = 1 - r.t / (r.max > 36 ? .55 : .5);
    ctx.strokeStyle = r.c;
    ctx.globalAlpha = Math.max(0, 1 - k) * .8;
    ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, 4 + r.max * k, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r.x, r.y, (4 + r.max * k) * .6, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* espectro: cuerpo translúcido con faldón ondulado */
function drawGhost(e){
  const x = e.x, y = e.y;
  e.anim = (e.anim || 0) + .08;
  const bob = Math.sin(e.anim) * 2.2;
  const yy = y + bob;
  const fade = .72 + Math.sin(e.anim * .7) * .12;

  ctx.save();
  ctx.globalAlpha = fade;

  // resplandor
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const rgb = e.glow || '143,233,255';
  const gl = ctx.createRadialGradient(x, yy, 2, x, yy, 20);
  gl.addColorStop(0, 'rgba(' + rgb + ',.45)');
  gl.addColorStop(1, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, yy, 20, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // cuerpo
  const g = ctx.createLinearGradient(x, yy - 13, x, yy + 13);
  g.addColorStop(0, '#eafcff');
  g.addColorStop(.5, e.color);
  g.addColorStop(1, 'rgba(60,140,180,.75)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, yy - 1, 11.5, Math.PI, 0);
  ctx.lineTo(x + 11.5, yy + 6);
  for (let i = 0; i < 3; i++){                 // faldón ondulado
    const w = 23 / 3, x0 = x + 11.5 - i * w;
    ctx.quadraticCurveTo(x0 - w / 2, yy + 6 + Math.sin(e.anim * 2 + i) * 4 + 5,
                         x0 - w, yy + 6);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.2; ctx.stroke();

  // ojos
  const ox = (e.dir?.[0] || 0) * 2, oy = (e.dir?.[1] || 0) * 1.5;
  ctx.fillStyle = 'rgba(10,25,40,.85)';
  ctx.beginPath();
  ctx.ellipse(x - 4.2 + ox, yy - 3 + oy, 2.6, 3.6, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 4.2 + ox, yy - 3 + oy, 2.6, 3.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.arc(x - 5 + ox, yy - 4.5 + oy, .9, 0, Math.PI * 2);
  ctx.arc(x + 3.4 + ox, yy - 4.5 + oy, .9, 0, Math.PI * 2); ctx.fill();
  // boquita
  ctx.fillStyle = 'rgba(10,25,40,.55)';
  ctx.beginPath(); ctx.ellipse(x + ox * .6, yy + 3, 2.4, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* araña: cuerpo bajo con ocho patas angulosas */
function drawSpider(e){
  const x = e.x, y = e.y;
  e.anim = (e.anim || 0) + .22;
  const face = (e.dir?.[0] || 0) >= 0 ? 1 : -1;

  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.beginPath(); ctx.ellipse(x, y + 11, 13, 4, 0, 0, Math.PI * 2); ctx.fill();

  // patas
  ctx.strokeStyle = shade(e.color, -.35);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++){
    const paso = Math.sin(e.anim + i * 1.5) * 3;
    for (const lado of [-1, 1]){
      const bx = x + lado * 5, by = y - 2 + i * 2.4;
      const mx = x + lado * (13 + i), my = by - 7 + paso;
      const fx = x + lado * (17 + i * 1.5), fy = y + 9 - paso * .5;
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(mx, my); ctx.lineTo(fx, fy);
      ctx.stroke();
    }
  }

  // abdomen y cabeza
  const g = ctx.createRadialGradient(x - 3, y - 4, 1, x, y, 13);
  g.addColorStop(0, shade(e.color, .4));
  g.addColorStop(.55, e.color);
  g.addColorStop(1, shade(e.color, -.5));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x - face * 3, y + 1, 10, 8.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + face * 7, y - 1, 6.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(10,6,4,.55)'; ctx.lineWidth = 1.3; ctx.stroke();
  // marca del lomo
  ctx.fillStyle = 'rgba(20,10,6,.55)';
  ctx.beginPath();
  ctx.moveTo(x - face * 3, y - 5); ctx.lineTo(x - face * 7, y + 2); ctx.lineTo(x - face * 3, y + 6);
  ctx.lineTo(x + face * 1, y + 2); ctx.closePath(); ctx.fill();

  // racimo de ojos
  ctx.fillStyle = '#fff3c4';
  [[0,-2.2,1.7],[0,1.6,1.5],[4.2,-1,1.2],[4.2,2,1.1]].forEach(([ox, oy, r]) => {
    ctx.beginPath(); ctx.arc(x + face * (6 + ox * .6), y - 1 + oy, r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.fillStyle = '#2a0f08';
  ctx.beginPath(); ctx.arc(x + face * 6, y - 3.2, .8, 0, Math.PI * 2);
  ctx.arc(x + face * 6, y + .6, .7, 0, Math.PI * 2); ctx.fill();
}

/* cristal: fragmento angular que gira y levita */
function drawCrystal(e){
  const x = e.x, y = e.y;
  e.anim = (e.anim || 0) + .045;
  const yy = y + Math.sin(e.anim * 1.6) * 3;
  const rot = e.anim * .8;
  const pulse = .5 + Math.sin(e.anim * 3) * .5;

  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(x, y + 13, 8, 3, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(x, yy, 1, x, yy, 22);
  gl.addColorStop(0, 'rgba(226,107,255,' + (.35 + pulse * .25) + ')');
  gl.addColorStop(1, 'rgba(226,107,255,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, yy, 22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, yy);
  ctx.rotate(Math.sin(rot) * .35);
  // esquirlas orbitando
  ctx.fillStyle = 'rgba(226,107,255,.7)';
  for (let i = 0; i < 3; i++){
    const a = rot * 2 + i * 2.1;
    ctx.save();
    ctx.translate(Math.cos(a) * 14, Math.sin(a) * 9);
    ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0, -3.5); ctx.lineTo(2.2, 0); ctx.lineTo(0, 3.5); ctx.lineTo(-2.2, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // cuerpo: rombo alargado
  const g = ctx.createLinearGradient(-9, -14, 9, 14);
  g.addColorStop(0, '#ffe3ff');
  g.addColorStop(.45, e.color);
  g.addColorStop(1, '#6d1f8a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -14); ctx.lineTo(9, -3); ctx.lineTo(5, 13); ctx.lineTo(-5, 13); ctx.lineTo(-9, -3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,230,255,.75)'; ctx.lineWidth = 1.3; ctx.stroke();
  // facetas
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -14); ctx.lineTo(-2, 13);
  ctx.moveTo(0, -14); ctx.lineTo(4, 13);
  ctx.moveTo(-9, -3); ctx.lineTo(9, -3);
  ctx.stroke();
  // ojo interior
  ctx.fillStyle = 'rgba(255,255,255,' + (.55 + pulse * .45) + ')';
  ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 4.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* gelatina: masa blanda que tiembla y se aplasta al moverse */
function drawSlime(e){
  e.anim = (e.anim || 0) + .13;
  const moviendo = !!(e.dir && (e.dir[0] || e.dir[1]));
  const t = e.anim;
  const squash = 1 + Math.sin(t * (moviendo ? 2.2 : 1.1)) * (moviendo ? .16 : .07);
  const w = 13 / squash, h = 11.5 * squash;
  const x = e.x, y = e.y + 2;

  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(x, y + 9, w * .8, 3.4, 0, 0, Math.PI * 2); ctx.fill();

  // cuerpo gelatinoso con borde ondulado
  ctx.save();
  ctx.globalAlpha = .92;
  const g = ctx.createRadialGradient(x - 4, y - h * .5, 1, x, y, w * 1.3);
  g.addColorStop(0, '#e6ffd8');
  g.addColorStop(.35, e.color);
  g.addColorStop(1, '#2f7a2c');
  ctx.fillStyle = g;
  ctx.beginPath();
  const pasos = 22;
  for (let i = 0; i <= pasos; i++){
    const a = (i / pasos) * Math.PI * 2;
    const onda = 1 + Math.sin(a * 3 + t * 3) * .05 + Math.sin(a * 5 - t * 2) * .03;
    const px = x + Math.cos(a) * w * onda;
    const py = y + Math.sin(a) * h * onda * (Math.sin(a) > 0 ? .92 : 1);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(20,60,20,.45)'; ctx.lineWidth = 1.3; ctx.stroke();

  // burbujas internas
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  for (let i = 0; i < 3; i++){
    const a = t * .6 + i * 2.1;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * w * .35, y + Math.sin(a * 1.3) * h * .35, 1.6 + i * .4, 0, Math.PI * 2);
    ctx.fill();
  }
  // brillo
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(x - 4.5, y - h * .45, 3.4, 2, -.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // núcleo
  ctx.fillStyle = 'rgba(40,110,40,.5)';
  ctx.beginPath(); ctx.ellipse(x, y + 2, w * .35, h * .3, 0, 0, Math.PI * 2); ctx.fill();

  // ojitos
  const ox = (e.dir?.[0] || 0) * 1.8, oy = (e.dir?.[1] || 0) * 1.2;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(x - 3.6 + ox * .5, y - 2 + oy * .5, 2.6, 3, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 3.6 + ox * .5, y - 2 + oy * .5, 2.6, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#16321a';
  ctx.beginPath();
  ctx.arc(x - 3.6 + ox, y - 2 + oy, 1.4, 0, Math.PI * 2);
  ctx.arc(x + 3.6 + ox, y - 2 + oy, 1.4, 0, Math.PI * 2);
  ctx.fill();
  // boquita boba
  ctx.strokeStyle = 'rgba(20,50,20,.7)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 1.8, y + 3.4); ctx.quadraticCurveTo(x, y + 5, x + 1.8, y + 3.4);
  ctx.stroke();
}

/* plátano rosa estilo dibujo animado: ojazos, bocaza y rabito. Se agita antes de disparar */
function drawBanana(e){
  e.anim = (e.anim || 0) + .1;
  const cargando = e.charge > 0;
  const sx = cargando ? (Math.random() - .5) * 5 : 0;
  const sy = cargando ? (Math.random() - .5) * 5 : 0;
  const x = e.x + sx, y = e.y + sy + (cargando ? 0 : Math.sin(e.anim) * 1.2);
  const face = (e.chargeDir?.[0] || e.dir?.[0] || 1) >= 0 ? 1 : -1;
  const tilt = cargando ? Math.sin(e.anim * 6) * .3 : Math.sin(e.anim * .8) * .06;
  const W = 6, H = 16, B = 4;                 // ancho, alto y arqueo

  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.ellipse(e.x, e.y + 14, 8, 3, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.scale(face, 1);

  // cuerpo en media luna
  const g = ctx.createLinearGradient(-W, 0, W + B, 0);
  g.addColorStop(0, '#b8407c');
  g.addColorStop(.30, e.color);
  g.addColorStop(.62, '#ffd9ec');
  g.addColorStop(1, '#e878b0');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-2.6, -H + 1);
  ctx.quadraticCurveTo(-3.4, -H - 2.2, 0, -H - 2.4);              // remate de arriba
  ctx.quadraticCurveTo(3.2, -H - 2.2, 3.2, -H + 2);
  ctx.quadraticCurveTo(B + 1.9 * W, 2, 2.2, H - 1);               // lomo exterior
  ctx.quadraticCurveTo(1.4, H + 3, -1.6, H + 2.6);                // punta de abajo
  ctx.quadraticCurveTo(-3.4, H + 1.4, -3.4, H - 2);
  ctx.quadraticCurveTo(B - 2.1 * W, 0, -2.6, -H + 1);             // curva interior
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,30,75,.55)'; ctx.lineWidth = 1.6; ctx.stroke();

  // brillo del lomo
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  ctx.beginPath();
  ctx.moveTo(2.5, -H + 4);
  ctx.quadraticCurveTo(B + 1.2 * W, 1, 1.5, H - 4);
  ctx.quadraticCurveTo(B + .5 * W, 1, 2.5, -H + 4);
  ctx.fill();

  // punta oscura de abajo
  ctx.fillStyle = '#4a2338';
  ctx.beginPath(); ctx.ellipse(-.6, H + 1.6, 2.2, 1.9, .35, 0, Math.PI * 2); ctx.fill();

  // rabito verde
  ctx.fillStyle = '#8fae4a';
  ctx.beginPath();
  ctx.moveTo(-2.2, -H - 1); ctx.lineTo(2.6, -H - 1);
  ctx.quadraticCurveTo(3.6, -H - 6, 1.2, -H - 7.5);
  ctx.lineTo(-1.4, -H - 6.4);
  ctx.quadraticCurveTo(.4, -H - 5, -2.2, -H - 1);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(70,90,30,.7)'; ctx.lineWidth = 1.1; ctx.stroke();

  // ---- cara ----
  const mira = cargando ? 1 : 0;
  // ojos grandes con contorno
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#3a1024'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.ellipse(-1.2, -5.5, 4.1, 4.6, -.12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(6.4, -5, 4.1, 4.6, .1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // iris marrón + pupila
  ctx.fillStyle = '#8b4a2b';
  ctx.beginPath();
  ctx.arc(-.6 + mira, -5.2, 2.5, 0, Math.PI * 2);
  ctx.arc(7 + mira, -4.7, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a1018';
  ctx.beginPath();
  ctx.arc(-.4 + mira, -5.1, 1.4, 0, Math.PI * 2);
  ctx.arc(7.2 + mira, -4.6, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.arc(-1.4 + mira, -6.2, .9, 0, Math.PI * 2);
  ctx.arc(6.2 + mira, -5.7, .9, 0, Math.PI * 2); ctx.fill();
  // cejas
  ctx.strokeStyle = '#3a1024'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath();
  if (cargando){
    ctx.moveTo(-4.4, -9.6); ctx.lineTo(1.4, -8.4);
    ctx.moveTo(9.6, -9.2); ctx.lineTo(4, -8);
  } else {
    ctx.moveTo(-4, -9.8); ctx.quadraticCurveTo(-1, -11.4, 1.8, -9.6);
    ctx.moveTo(3.6, -9.4); ctx.quadraticCurveTo(6.6, -11, 9.4, -9);
  }
  ctx.stroke();

  // boca
  if (cargando){
    ctx.fillStyle = '#5c1030';
    ctx.beginPath(); ctx.ellipse(3, 2.2, 2.4, 2.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a1024'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,175,.6)';
    ctx.beginPath();
    ctx.arc(-2.4, 1.4, 2, 0, Math.PI * 2);
    ctx.arc(8.4, 1.8, 2, 0, Math.PI * 2); ctx.fill();
  } else {
    // bocaza abierta sonriendo, con lengua
    ctx.fillStyle = '#6d0f2f';
    ctx.beginPath(); ctx.ellipse(3, 2.8, 5.6, 4.4, .06, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a1024'; ctx.lineWidth = 1.4; ctx.stroke();
    // dientes de arriba
    ctx.save();
    ctx.beginPath(); ctx.ellipse(3, 2.8, 5.6, 4.4, .06, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -2.4, 12, 2.6);
    // lengua
    ctx.fillStyle = '#ff8fa6';
    ctx.beginPath(); ctx.ellipse(2.4, 6.6, 3.4, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* calavera: cráneo flotante con cuencas encendidas */
function drawSkull(e){
  const x = e.x, y = e.y;
  e.anim = (e.anim || 0) + .06;
  const yy = y + Math.sin(e.anim * 1.5) * 2.4;
  const glow = .55 + Math.sin(e.anim * 4) * .45;
  const face = (e.dir?.[0] || 0) >= 0 ? 1 : -1;

  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(x, y + 13, 9, 3.2, 0, 0, Math.PI * 2); ctx.fill();

  // llamitas de fondo
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(x, yy - 2, 2, x, yy - 2, 20);
  gl.addColorStop(0, 'rgba(150,190,255,' + (.28 + glow * .2) + ')');
  gl.addColorStop(1, 'rgba(120,160,255,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(x, yy - 2, 20, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, yy);
  ctx.scale(face, 1);

  // cráneo
  const g = ctx.createLinearGradient(0, -12, 0, 10);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#9aa2c0');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, -3, 10.5, 9.5, 0, 0, Math.PI * 2); ctx.fill();
  // mandíbula
  ctx.beginPath();
  ctx.moveTo(-6.5, 3); ctx.lineTo(6.5, 3); ctx.lineTo(5, 10); ctx.lineTo(-5, 10);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(30,34,60,.5)'; ctx.lineWidth = 1.2; ctx.stroke();
  // dientes
  ctx.strokeStyle = 'rgba(40,44,70,.6)'; ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++){
    ctx.beginPath(); ctx.moveTo(i * 2.4, 3.5); ctx.lineTo(i * 2.4, 9); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(-6, 3.4); ctx.lineTo(6, 3.4); ctx.stroke();

  // cuencas encendidas
  ctx.fillStyle = 'rgba(20,20,35,.9)';
  ctx.beginPath();
  ctx.ellipse(-4.4, -4, 3.6, 4.2, .15, 0, Math.PI * 2);
  ctx.ellipse(4.4, -4, 3.6, 4.2, -.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(120,200,255,' + (.6 + glow * .4) + ')';
  ctx.beginPath();
  ctx.arc(-4.4, -4, 2 + glow, 0, Math.PI * 2);
  ctx.arc(4.4, -4, 2 + glow, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // nariz
  ctx.fillStyle = 'rgba(30,34,60,.75)';
  ctx.beginPath(); ctx.moveTo(0, -1.5); ctx.lineTo(1.8, 2); ctx.lineTo(-1.8, 2); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* vigía: orbe flotante con un ojo grande y anillo giratorio */
function drawEye(e){
  const x = e.x, y = e.y;
  e.anim = (e.anim || 0) + .05;
  const bob = Math.sin(e.anim * 1.3) * 1.8;
  const yy = y + bob;

  ctx.fillStyle = 'rgba(0,0,0,.40)';
  ctx.beginPath(); ctx.ellipse(x, y + 14, 9, 3.2, 0, 0, Math.PI * 2); ctx.fill();

  // anillo orbital
  ctx.save();
  ctx.translate(x, yy);
  ctx.rotate(e.anim * .9);
  ctx.strokeStyle = 'rgba(255,207,77,.85)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.ellipse(0, 0, 15, 5.5, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.arc(15, 0, 2, 0, Math.PI * 2);
  ctx.arc(-15, 0, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // orbe
  const g = ctx.createRadialGradient(x - 4, yy - 5, 1, x, yy, 12);
  g.addColorStop(0, '#fff6da');
  g.addColorStop(.55, e.color);
  g.addColorStop(1, '#8a5f10');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, yy, 11.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(40,25,0,.6)'; ctx.lineWidth = 1.5; ctx.stroke();

  // ojo que mira al jugador más cercano
  const target = players.filter(p => p.alive)
    .sort((a, b) => Math.hypot(a.x - x, a.y - yy) - Math.hypot(b.x - x, b.y - yy))[0];
  let vx = e.dir?.[0] || 0, vy = e.dir?.[1] || 0;
  if (target){
    const d = Math.hypot(target.x - x, target.y - yy) || 1;
    vx = (target.x - x) / d; vy = (target.y - yy) / d;
  }
  ctx.fillStyle = '#fffdf5';
  ctx.beginPath(); ctx.ellipse(x, yy, 7.5, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c0392b';
  ctx.beginPath(); ctx.arc(x + vx * 2.6, yy + vy * 2.6, 4.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1008';
  ctx.beginPath(); ctx.arc(x + vx * 3.4, yy + vy * 3.4, 2.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(x + vx * 2 - 2, yy + vy * 2 - 2.4, 1.1, 0, Math.PI * 2); ctx.fill();
}

/* barra de vida flotando sobre el personaje */
// el jugador se encoge girando al irse y se despliega al llegar
function drawWarp(p){
  const mitad = WARP_DUR / 2;
  const saliendo = !p.warp.saltado;
  const prog = saliendo ? (WARP_DUR - p.warp.t) / mitad : 1 - p.warp.t / mitad;
  const escala = Math.max(0, saliendo ? 1 - prog : prog);
  const giro = (saliendo ? prog : 1 - prog) * 7;
  const x = p.x, y = p.y;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const rr = 26 * (1 - escala) + 8;
  const g = ctx.createRadialGradient(x, y, 1, x, y, rr);
  g.addColorStop(0, 'rgba(255,255,255,' + (.5 * (1 - Math.abs(.5 - escala) * 2) + .25) + ')');
  g.addColorStop(.4, p.color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = .55;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();

  // espiral
  ctx.globalAlpha = .8;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 40; i++){
    const a = giro + i * .35, r = 3 + i * .55 * (1 - escala * .6);
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r * .75;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;

  if (escala > .05){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(escala, Math.max(.1, escala * (2 - escala)));
    ctx.rotate((1 - escala) * (saliendo ? 1 : -1) * .8);
    drawChar(p, 0, 0, p.color, [0, 0], { noShadow: true, alpha: .5 + escala * .5 });
    ctx.restore();
  }
}

function drawHPBar(p, x, y){
  const max = Math.max(3, p.maxLives || 3);
  const vidas = Math.max(0, p.lives);
  const segW = 8, gap = 2;
  const w = max * segW + (max - 1) * gap;
  const bx = x - w / 2, by = y - 27;
  const col = vidas <= 1 ? '#ff6b6b' : vidas === 2 ? '#ffc247' : '#5ddc7a';
  const parpadeo = vidas <= 1 ? .55 + Math.sin(T() * 8) * .45 : 1;

  ctx.save();
  // fondo
  ctx.fillStyle = 'rgba(8,10,18,.6)';
  roundRect(bx - 2, by - 2, w + 4, 8, 3); ctx.fill();

  for (let i = 0; i < max; i++){
    const sx = bx + i * (segW + gap);
    if (i < vidas){
      ctx.globalAlpha = parpadeo;
      const g = ctx.createLinearGradient(sx, by, sx, by + 4);
      g.addColorStop(0, shade(col, .35));
      g.addColorStop(1, col);
      ctx.fillStyle = g;
      roundRect(sx, by, segW, 4, 1.5); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      roundRect(sx, by, segW, 4, 1.5); ctx.fill();
    }
  }
  ctx.restore();
}

function vignette(){
  const g = ctx.createRadialGradient(
    W / 2, H / 2, H * .35,
    W / 2, H / 2, H * .85);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function render(){
  const ahora = performance.now();
  const dtVis = Math.min(.05, (ahora - (render.ultimo || ahora)) / 1000);
  render.ultimo = ahora;
  sacudida *= .86;
  fogonazo = Math.max(0, fogonazo - dtVis * 3.2);
  luces = luces.filter(l => (l.t -= dtVis) > 0);

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (sacudida > .2){
    ctx.translate((Math.random() - .5) * sacudida, (Math.random() - .5) * sacudida);
    ctx.rotate((Math.random() - .5) * sacudida * .0016);
  }
  if (boardSucio) pintarTableroEstatico();
  ctx.drawImage(boardLayer, 0, 0, W, H);

  // objetos e items bajo el resto
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (grid[y][x] === EMPTY && items[y][x]) drawItem(x, y, items[y][x]);

  bombs.forEach(drawBomb);

  mounts.forEach(m => drawMount(m, m.x, m.y, { moving: true, alpha: m.flee > 0 ? .85 : 1 }));

  // marca del destino de los enemigos que están a punto de saltar
  enemies.forEach(e => {
    if (e.tpWarn <= 0 || !e.tpDestino) return;
    const k = 1 - e.tpWarn / ENEMY_TP_AVISO;         // 0 → 1 según se acerca el salto
    const dx = center(e.tpDestino.nx), dy = center(e.tpDestino.ny);

    ctx.save();
    // línea punteada hasta el destino
    ctx.setLineDash([4, 6]); ctx.lineDashOffset = -T() * 26;
    ctx.strokeStyle = e.color; ctx.globalAlpha = .35 + k * .3;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(dx, dy); ctx.stroke();
    ctx.setLineDash([]);

    // halo en el destino
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(dx, dy, 2, dx, dy, TS * .8);
    g.addColorStop(0, e.color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = .18 + k * .25;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(dx, dy, TS * .8, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // aro que se cierra: marca cuánto falta
    ctx.globalAlpha = .85;
    ctx.strokeStyle = e.color; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(dx, dy, 6 + (1 - k) * 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
    ctx.stroke();
    // silueta fantasma de dónde caerá
    ctx.globalAlpha = .25 + k * .3;
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(dx, dy, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath();
    ctx.arc(dx - 3, dy - 2, 1.8, 0, Math.PI * 2);
    ctx.arc(dx + 3, dy - 2, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  });

  enemies.forEach(e => {
    if (e.tpWarn > 0){                          // halo de carga antes de saltar
      const k = 1 - e.tpWarn / ENEMY_TP_AVISO;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, 14 + k * 12);
      g.addColorStop(0, e.color); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = .35 + Math.sin(T() * 30) * .2;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.x, e.y, 14 + k * 12, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    if (e.kind === 'titan') drawTitan(e);
    else if (e.kind === 'ghost') drawGhost(e);
    else if (e.kind === 'redghost') drawGhost(e);
    else if (e.kind === 'eye') drawEye(e);
    else if (e.kind === 'spider') drawSpider(e);
    else if (e.kind === 'crystal') drawCrystal(e);
    else if (e.kind === 'skull') drawSkull(e);
    else if (e.kind === 'banana') drawBanana(e);
    else if (e.kind === 'slime') drawSlime(e);
    else drawChar(e, e.x, e.y, e.color, e.dir, { enemy: true, dark: 'rgba(20,0,30,.6)' });
    if (e.charge > 0) drawCharge(e);
  });

  players.forEach(p => {
    if (p.warp){ drawWarp(p); return; }
    if (p.dying > 0){
      drawChar(p, p.x, p.y - (1.1 - p.dying) * 22, '#9aa0b5', [0, 0],
               { alpha: Math.max(0, p.dying) });
      return;
    }
    if (!p.alive) return;
    const dir = p.face || [0, 0];
    const blink = p.invuln > 0 && Math.floor(p.invuln * 10) % 2 === 0;
    if (p.mount){
      const moving = !!(dir[0] || dir[1]);
      drawMount(p.mount, p.x, p.y + 6, { moving, ridden: true, alpha: blink ? .4 : 1 });
      drawChar(p, p.x - 2 * (p.mount.face || 1), p.y - 14, p.color, dir,
               { alpha: blink ? .4 : 1, noShadow: true });
      drawHPBar(p, p.x, p.y - 14);
    } else {
      drawChar(p, p.x, p.y, p.color, dir, { alpha: blink ? .4 : 1 });
      drawHPBar(p, p.x, p.y);
    }
  });

  players.forEach(p => { if (p.aim && p.alive) drawAim(p); });

  flames.forEach(drawFlame);
  beams.forEach(drawBeam);
  drawRings();

  for (const p of particles){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.t * 1.6));
    ctx.fillStyle = p.c;
    const s = 2 + p.t * 4;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    ctx.globalAlpha = 1;
  }

  // luz de las explosiones iluminando el tablero
  if (luces.length){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    luces.forEach(l => {
      const k = l.t / .35, f = l.f == null ? 1 : l.f;
      const rr = TS * (1 + f * 2.1 + (1 - k) * (1.4 + f * 3.4));
      const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, rr);
      g.addColorStop(0, 'rgba(255,220,160,' + (.3 + .45 * f) * k + ')');
      g.addColorStop(.45, 'rgba(255,140,50,' + (.14 + .26 * f) * k + ')');
      g.addColorStop(1, 'rgba(255,90,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(l.x - rr, l.y - rr, rr * 2, rr * 2);
    });
    ctx.restore();
  }
  ctx.restore();

  // fogonazo
  if (fogonazo > .01){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,225,180,' + fogonazo + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  vignette();
}

/* ---------- HUD / overlay ---------- */
function updateHUD(){
  const p = players ? players[0] : null;
  document.getElementById('h-level').textContent = level + ' · ' + TH().name;
  if (document.activeElement !== devLevel) devLevel.value = level;
  document.getElementById('h-score').textContent = score;
  const vidas = p ? Math.max(0, p.lives) : 0;
  const maxVidas = p ? Math.max(3, p.maxLives || 3) : 3;
  document.getElementById('h-lives').textContent = vidas;
  const bar = document.getElementById('h-hp');
  if (bar.children.length !== maxVidas){
    bar.innerHTML = '';
    for (let i = 0; i < maxVidas; i++) bar.appendChild(document.createElement('div'));
  }
  const tono = vidas <= 1 ? 'r' : vidas === 2 ? 'y' : 'g';
  [...bar.children].forEach((seg, i) => {
    seg.className = 'seg' + (i < vidas ? ' on ' + tono : '');
  });
  document.getElementById('h-bombs').textContent = p ? p.maxBombs : 0;
  document.getElementById('h-fire').textContent  = p ? p.range : 0;
  document.getElementById('h-enem').textContent  = enemies ? enemies.length : 0;
  const tEl = document.getElementById('h-tp');
  if (p){
    tEl.textContent = p.aim ? 'Apuntando…' : 'Listo';
    tEl.style.color = p.aim ? '#7effc4' : '';
  }
  canvas.style.cursor = p && p.aim ? 'crosshair' : 'default';
  const dEl = document.getElementById('h-det');
  if (p){
    const puestas = bombs ? bombs.filter(b => b.owner === p && b.remote).length : 0;
    dEl.textContent = p.remote ? (puestas ? 'E (' + puestas + ')' : 'E') : '—';
    dEl.style.color = p.remote ? '#ff7a7a' : '';
  }
  const sEl = document.getElementById('h-spike');
  if (p){
    sEl.textContent = p.spike ? 'Sí' : '—';
    sEl.style.color = p.spike ? '#9fe8ef' : '';
  }
  const mEl = document.getElementById('h-mount');
  mEl.textContent = p && p.mount ? MOUNTS[p.mount.type].label : '—';
  mEl.style.color = p && p.mount ? p.mount.color : '';
}

function showOverlay(title, text, buttons, tituloHTML = false){
  if (tituloHTML) ovTitle.innerHTML = title; else ovTitle.textContent = title;
  ovText.innerHTML = text;
  ovBtns.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.txt;
    if (b.ghost) el.className = 'ghost';
    el.onclick = b.act;
    ovBtns.appendChild(el);
  });
  overlay.classList.remove('hidden');
}

function showMenu(){
  mode = 'menu';
  showOverlay('Bombergay',
    'Pon bombas, rompe bloques, elimina a todos los enemigos y busca la puerta de salida.<br><br>' +
    '<b>1 jugador:</b> <span class="k">↑ ↓ ← →</span> o <span class="k">W A S D</span> mover · ' +
    '<span class="k">Espacio</span> bomba · <span class="k">Q</span> teleport · <span class="k">E</span> detonar<br>' +
    '<b>2 jugadores — P1:</b> <span class="k">↑ ↓ ← →</span> · <span class="k">Espacio</span> · <span class="k">Q</span> · <span class="k">E</span> · ' +
    '<b>P2:</b> <span class="k">W A S D</span> · <span class="k">Shift</span> · <span class="k">G</span> · <span class="k">F</span><br>' +
    '<span class="k">P</span> pausa · en móvil usa los controles de abajo',
    [{ txt: '1 jugador', act: () => startGame(false) },
     { txt: '2 jugadores', act: () => startGame(true), ghost: true },
     { txt: 'Menú principal', act: () => { location.href = '/menu.html'; }, ghost: true }]);
}

function modoInicialUrl(){
  const p = new URLSearchParams(location.search).get('p');
  return p === '1' || p === '2' ? p === '2' : null;
}

function startGame(two){
  twoPlayers = two;
  level = 1; score = 0; levelTimer = 0;
  players = two ? [makePlayer(0), makePlayer(1)] : [makePlayer(0)];
  buildLevel();
  overlay.classList.add('hidden');
  mode = 'play';
}

function togglePause(){
  if (mode === 'play'){
    mode = 'paused';
    showOverlay('Pausa', 'El juego está detenido.',
      [{ txt: 'Continuar', act: () => { overlay.classList.add('hidden'); mode = 'play'; } },
       { txt: 'Menú', act: showMenu, ghost: true }]);
  } else if (mode === 'paused' && ovTitle.textContent === 'Pausa'){
    overlay.classList.add('hidden'); mode = 'play';
  }
}

/* ---------- entrada ---------- */
addEventListener('keydown', e => {
  if (e.repeat) return;                 // ignora la repetición al mantener pulsado
  if (e.key === 'p' || e.key === 'P'){ togglePause(); return; }
  if (e.key === '['){ cycleTheme(-1); return; }                 // DEV: escenario anterior
  if (e.key === ']'){ cycleTheme(1);  return; }                 // DEV: siguiente escenario
  if (e.key === '\\'){ setTheme('auto'); return; }              // DEV: volver a automático
  if (e.key === '-'){ gotoLevel(level - 1); return; }           // DEV: nivel anterior
  if (e.key === '+' || e.key === '='){ gotoLevel(level + 1); return; }   // DEV: nivel siguiente
  if (e.key === 'r' || e.key === 'R'){                          // DEV: soltar un enemigo
    if (grid && mode === 'play')
      spawnEnemy(devKind.value === 'auto' ? pickKind(level) : devKind.value);
    return;
  }
  if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
  if (e.key === ' ') keys[' '] = true;
});
addEventListener('keyup', e => {
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
});

// ratón: apuntar y teletransportar con un clic
function boardCell(ev){
  const r = canvas.getBoundingClientRect();
  const cx = Math.floor((ev.clientX - r.left) * (W / r.width) / TS);
  const cy = Math.floor((ev.clientY - r.top)  * (H / r.height) / TS);
  return { cx: Math.max(0, Math.min(COLS - 1, cx)), cy: Math.max(0, Math.min(ROWS - 1, cy)) };
}

canvas.addEventListener('mousemove', ev => {
  const p = players && players[0];
  if (!p || !p.aim) { hover = null; return; }                    // sin mira, el ratón no hace nada
  hover = boardCell(ev);
  p.aim.cx = hover.cx; p.aim.cy = hover.cy;                      // la mira sigue al ratón
});
canvas.addEventListener('mouseleave', () => { hover = null; });

canvas.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'mouse' || ev.button !== 0) return;      // solo clic izquierdo
  if (mode !== 'play') return;
  const p = players && players[0];
  if (!p || !p.alive || p.dying > 0 || !p.aim) return;             // solo con la mira abierta (T)
  const c = boardCell(ev);
  hover = c;
  p.aim.cx = c.cx; p.aim.cy = c.cy;
  doTeleport(p);                                                   // si no vale, sigue apuntando
});

// controles táctiles
const padKey = { up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight' };
document.querySelectorAll('.dpad button').forEach(btn => {
  const k = padKey[btn.dataset.d];
  const on  = e => { e.preventDefault(); keys[k] = true; };
  const off = e => { e.preventDefault(); keys[k] = false; };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off, {passive:false});
  btn.addEventListener('touchcancel', off, {passive:false});
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});
const fireBtn = document.getElementById('fire');
const fireOn = e => { e.preventDefault(); keys[' '] = true; };
fireBtn.addEventListener('touchstart', fireOn, {passive:false});
fireBtn.addEventListener('mousedown', fireOn);

const detBtn = document.getElementById('det');
const detOn = e => { e.preventDefault(); keys['e'] = true; };
detBtn.addEventListener('touchstart', detOn, {passive:false});
detBtn.addEventListener('mousedown', detOn);

const tpBtn = document.getElementById('tp');
const tpOn = e => { e.preventDefault(); keys['q'] = true; };
tpBtn.addEventListener('touchstart', tpOn, {passive:false});
tpBtn.addEventListener('mousedown', tpOn);

/* ---------- panel de desarrollo ---------- */
const devSel = document.getElementById('dev-theme');
(function initDev(){
  const auto = document.createElement('option');
  auto.value = 'auto'; auto.textContent = 'Auto (según nivel)';
  devSel.appendChild(auto);
  THEMES.forEach((t, i) => {
    const o = document.createElement('option');
    o.value = String(i); o.textContent = (i + 1) + '. ' + t.name;
    devSel.appendChild(o);
  });
})();

function setTheme(v){
  themeOverride = v === 'auto' || v == null ? null : ((v % THEMES.length) + THEMES.length) % THEMES.length;
  devSel.value = themeOverride == null ? 'auto' : String(themeOverride);
  boardSucio = true;
  beep(700, .05, 'sine', .03);
}
function cycleTheme(paso){
  const actual = themeOverride != null ? themeOverride : (level - 1) % THEMES.length;
  setTheme(actual + paso);
}

// salto directo de nivel
const devLevel = document.getElementById('dev-level');
function gotoLevel(n){
  level = Math.max(1, Math.min(99, Math.round(n) || 1));
  levelTimer = 0;
  if (!players) players = [makePlayer(0)];
  buildLevel();
  resetPositions();
  devLevel.value = level;
  overlay.classList.add('hidden');
  mode = 'play';
  beep(760, .08, 'sine', .04);
}
devLevel.addEventListener('change', () => gotoLevel(+devLevel.value));
document.getElementById('dev-lvl-prev').onclick = () => gotoLevel(level - 1);
document.getElementById('dev-lvl-next').onclick = () => gotoLevel(level + 1);

// selector de enemigos
const devKind = document.getElementById('dev-kind');
(function initKinds(){
  const auto = document.createElement('option');
  auto.value = 'auto'; auto.textContent = 'Mezcla automática';
  devKind.appendChild(auto);
  Object.entries(ENEMY_KINDS).forEach(([k, v]) => {
    const o = document.createElement('option');
    o.value = k; o.textContent = 'Solo ' + v.name;
    devKind.appendChild(o);
  });
})();
devKind.addEventListener('change', () => {
  kindOverride = devKind.value === 'auto' ? null : devKind.value;
});
document.getElementById('dev-spawn').onclick = () => {
  const kind = devKind.value === 'auto' ? pickKind(level) : devKind.value;
  if (grid) spawnEnemy(kind);
};

devSel.addEventListener('change', () => setTheme(devSel.value === 'auto' ? 'auto' : +devSel.value));
document.getElementById('dev-prev').onclick = () => cycleTheme(-1);
document.getElementById('dev-next').onclick = () => cycleTheme(1);
document.getElementById('dev-regen').onclick = () => {
  buildLevel();
  resetPositions();
  if (mode === 'menu') return;
  mode = 'play';
};
[devSel, devKind, devLevel, ...document.querySelectorAll('#dev button')].forEach(el =>
  el.addEventListener('keydown', ev => ev.preventDefault()));   // que no se cuele en el juego

/* ---------- bucle ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  try {
    if (mode === 'play') update(dt);
    if (grid) render();
    updateHUD();
  } catch (err){
    console.error('fallo en el frame:', err);   // el bucle sigue vivo
  }
  requestAnimationFrame(loop);
}

players = [makePlayer(0)];
buildLevel();
const _m = modoInicialUrl();
if (_m === null) showMenu(); else startGame(_m);
requestAnimationFrame(loop);

})();
</script>
